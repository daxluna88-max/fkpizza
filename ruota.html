<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0e">
<link rel="icon" href="https://res.cloudinary.com/dajqdbpms/image/upload/w_180,h_180,c_fit,f_png,q_auto/www.fkpizza-and-more.com/wp-content/themes/fk-theme/img/fk-logo" type="image/png"/>
<link rel="apple-touch-icon" href="https://res.cloudinary.com/dajqdbpms/image/upload/w_180,h_180,c_fit,f_png,q_auto/www.fkpizza-and-more.com/wp-content/themes/fk-theme/img/fk-logo"/>
<title>FK Pizza &amp; More — La Ruota della Fortuna</title>

<!--
  ============================================================================
  LA RUOTA DELLA FORTUNA — FK Pizza & More

  Questa pagina non gioca più in autonomia: la ruota si sblocca solo dentro
  al sito, in automatico, al ritorno al menu dopo il primo ordine al tavolo,
  e solo per i clienti che hanno già la Tessera Oro. Non è più richiesto
  (né possibile) inserire un numero di telefono qui per sbloccarla: il
  numero, quando serve, viene già riconosciuto dal sito stesso, senza
  bisogno di digitarlo di nuovo.
  ============================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --oro:        #BC9F74;
  --oro-chiaro: #E6D5B8;
  --carbone-2:  #18191A;
  --crema:      #FDFDFD;
  --ease-out-quint: cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100dvh;
  background:radial-gradient(120% 80% at 50% -10%, #33383B 0%, #1A1E20 45%, #0E1112 100%);
  color:var(--crema);
  font-family:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px;
}
.logo-wrap{width:clamp(120px,32vw,170px);margin:0 auto 22px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.55));
  animation:entra .9s var(--ease-out-quint) both}
.logo-wrap img{width:100%;height:auto;display:block}
.scheda{
  width:min(460px,100%);border-radius:22px;padding:36px 30px;text-align:center;
  background:linear-gradient(170deg,#2C3133,#191D1F);
  border:1px solid rgba(201,160,99,.45);
  box-shadow:0 34px 80px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.09);
  animation:sale .6s .1s var(--ease-out-quint) both;
}
.occhiello{margin:0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(11px,2.6vw,13px);
  letter-spacing:.42em;text-transform:uppercase;color:var(--oro);opacity:.85}
h1{margin:8px 0 0;font-family:'Bodoni Moda',serif;font-weight:900;font-size:clamp(26px,7vw,38px);
  line-height:1.05;letter-spacing:-.01em;color:var(--crema)}
h1 em{font-style:italic;font-weight:400;color:var(--oro)}
.testo{margin:20px 0 0;font-size:15px;line-height:1.65;color:rgba(253,246,234,.75)}
.testo b{color:var(--oro-chiaro)}
.cta{
  display:inline-block;margin-top:26px;border:0;cursor:pointer;text-decoration:none;
  padding:15px 36px;border-radius:999px;font-family:'Bodoni Moda',serif;font-weight:900;
  font-size:16px;letter-spacing:.12em;color:#2B1E06;
  background:linear-gradient(180deg,#FBEDCB 0%,#DFC086 34%,#C9A063 62%,#9C7735 100%);
  box-shadow:0 3px 0 #6B4B18, 0 10px 22px rgba(0,0,0,.5), inset 0 2px 1px rgba(255,255,255,.85);
}
@keyframes entra{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes sale{from{opacity:0;transform:translateY(24px) scale(.95)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="logo-wrap"><img src="https://res.cloudinary.com/dajqdbpms/image/upload/w_400,f_auto,q_auto/www.fkpizza-and-more.com/wp-content/themes/fk-theme/img/fk-logo" alt="FK Pizza &amp; More"></div>
<div class="scheda">
  <p class="occhiello">Gioca e vinci</p>
  <h1>La Ruota <em>della</em> Fortuna</h1>
  <p class="testo">La ruota si sblocca <b>da sola</b> quando torni a trovarci: al ritorno al menu dopo il tuo primo ordine al tavolo, se hai già la <b>Tessera Oro</b>.</p>
  <p class="testo">Non serve inserire qui alcun numero di telefono: il sito ti riconosce già in automatico.</p>
  <a class="cta" href="https://fkpizza.com">Vai al sito →</a>
</div>
</body>
</html>
