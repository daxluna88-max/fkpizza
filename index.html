<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#c0392b;--gold:#b5986a;--crown:#d4b483;--black:#0a0a0a;--cream:#f2ede6;--dark:#111;--white:#fff;--font-serif:'Playfair Display',Georgia,serif;--font-sans:'Inter',sans-serif;
--ls1:#eef1f2;--ls2:#c3c9cd;--ls3:#8b939c;--ls4:#4d535a;--lg1:#f9e8b8;--lg2:#e0b452;--lg3:#a9782e;--lg4:#5f4419;
--adm-bg:#ffffff;--adm-surface:#ffffff;--adm-surface2:#f2f3f5;--adm-surface3:#e8eaed;--adm-line:rgba(15,15,20,.12);--adm-line2:rgba(15,15,20,.24);--adm-text:#15171c;--adm-text-dim:#666d78;--adm-accent:#c0392b;--adm-accent2:var(--gold);--adm-accent2-text:#8a6a2f;--adm-success:#1a9850;--adm-danger:#d92d38;--adm-radius:14px}
html{scroll-behavior:smooth;overflow-x:hidden}
body{font-family:var(--font-sans);background:var(--black);color:var(--white);overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
[hidden]{display:none!important}
#loader{position:fixed;inset:0;background:var(--black);z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .6s,visibility .6s}
#loader.out{opacity:0;visibility:hidden;pointer-events:none}
.ld-logo{width:90px;height:90px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;animation:ldpulse 1s ease-in-out infinite alternate}
.ld-logo img{width:70px;height:70px;object-fit:contain}
@keyframes ldpulse{from{transform:scale(.95);opacity:.8}to{transform:scale(1.05);opacity:1}}
nav,#r-nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(10,10,10,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .3s}
nav.solid,#r-nav.solid{background:rgba(10,10,10,.95)}
.nav-logo-wrap{width:58px;height:58px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.nav-logo-wrap img{width:48px;height:48px;object-fit:contain}
.nav-tagline{font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--crown)}
.nav-burger{width:48px;height:48px;background:rgba(26,26,26,.85);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex-shrink:0}
.nav-burger span{display:block;width:22px;height:2px;background:#fff;border-radius:2px}
#drawer{position:fixed;inset:0;z-index:800;visibility:hidden;opacity:0;transition:opacity .3s,visibility .3s}
#drawer.open{visibility:visible;opacity:1}
#drawer .ov{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#drawer .panel{position:absolute;top:0;right:0;bottom:0;width:84%;max-width:340px;background:#141210;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);padding:24px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
#drawer.open .panel{transform:none}
.dw-h{font-family:var(--font-serif);color:var(--gold);font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin:18px 0 6px}
.dw-link{display:block;padding:13px 4px;font-size:16px;border-bottom:1px solid rgba(255,255,255,.07);color:#eee}
.dw-link:active{color:var(--gold)}
.dw-rest{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-size:15px}
.dw-rest small{color:rgba(255,255,255,.4);font-size:11px}
.dw-close{position:absolute;top:14px;right:16px;width:40px;height:40px;font-size:26px;color:#fff}
.langrow{display:flex;gap:8px;margin-top:6px}
.langrow button{flex:1;padding:9px;border:1px solid rgba(181,152,106,.4);border-radius:8px;font-size:12px;font-weight:600;letter-spacing:.06em}
.langrow button.on{background:var(--gold);color:var(--black);border-color:var(--gold)}
.hero{position:relative;height:100svh;min-height:600px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:var(--black)}
.hero-bg{position:absolute;inset:-4%;background-color:var(--black);background-repeat:no-repeat;background-position:center;background-size:cover;will-change:transform}
.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,5,5,.2) 0%,rgba(5,5,5,0) 38%,rgba(5,5,5,.35) 70%,rgba(5,5,5,.88) 90%,rgba(5,5,5,.98) 100%)}
.hero-body{position:relative;z-index:2;padding:0 20px 56px}
.hero-center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;text-align:center;padding-top:96px}
.hero-center .logo-badge{width:148px;height:148px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.hero-center .logo-badge img{width:78%;height:78%;object-fit:contain}
.hero-h1{font-family:var(--font-serif);font-size:clamp(44px,13vw,92px);font-weight:900;line-height:.97;letter-spacing:-.01em;text-transform:uppercase;margin-bottom:16px;text-shadow:0 2px 30px rgba(0,0,0,.7)}
.hero-h1 em{color:var(--red);font-style:normal}
.hero-sub{font-size:13px;color:rgba(255,255,255,.9);letter-spacing:.04em;margin-bottom:26px;text-shadow:0 1px 16px rgba(0,0,0,.8)}
.hero-btn{display:inline-flex;align-items:center;gap:8px;padding:15px 24px;background:var(--red);color:#fff;border-radius:14px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 4px 16px rgba(192,57,43,.3)}
.hero-scroll{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:2;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45)}
#r-hero-bg{inset:0}
#r-bottombar{position:fixed;bottom:0;left:0;right:0;z-index:700;display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(10,10,10,.9);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.08)}
#r-bottombar a{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:14px 8px;border-radius:12px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#fff}
#r-bottombar a svg{width:17px;height:17px}
#r-bottombar a.call{background:#1f1f1f}#r-bottombar a.book{background:var(--red)}#r-bottombar a.wa{background:#1f8f4e}
.has-bottombar{padding-bottom:84px}
.logo-sec{background:var(--black);display:flex;flex-direction:column;align-items:center;padding:60px 20px}
.logo-big{width:180px;height:180px;background:#fff;border-radius:24px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;overflow:hidden}
.logo-big img{width:80%;height:80%;object-fit:contain}
.logo-sub{font-size:11px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--crown);display:flex;align-items:center;gap:10px}
.logo-sub em{font-style:normal;font-size:7px;opacity:.5}
.sec{padding:60px 0}
.sec-cream{background:var(--cream);color:var(--black)}
.sec-dark{background:var(--black);color:var(--white)}
.sec-hd{text-align:center;padding:0 20px;margin-bottom:32px}
.sec-tag{font-size:10px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:10px}
.sec-title{font-family:var(--font-serif);font-size:clamp(30px,8vw,58px);font-weight:700;line-height:1.05}
.sec-title em{color:var(--red);font-style:normal}
.sec-rule{width:46px;height:2px;background:var(--red);margin:14px auto 0}
.cat-title{font-family:var(--font-serif);font-size:clamp(24px,6vw,38px);font-weight:700;text-align:center;margin:6px 0 4px;text-transform:uppercase;letter-spacing:.02em}
.cat-rule{width:40px;height:2px;background:var(--gold);margin:0 auto 22px}
.sec-cream .cat-title{color:var(--black)}
.rv{opacity:0;transform:translateY(30px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
.car-scroll{overflow:hidden}
.car-track{display:flex;position:relative;transition:transform .45s cubic-bezier(.4,0,.2,1);will-change:transform}
.car-nav{display:flex;gap:12px;justify-content:center;margin-top:22px}
.car-btn{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0;touch-action:manipulation}
.car-btn:active{transform:scale(.9)}
.car-btn svg{width:14px;height:14px}
.car-btn-dark{border:1.5px solid rgba(0,0,0,.2);background:#fff;color:#222}
.car-btn-dark:active{background:var(--red);border-color:var(--red);color:#fff}
.car-btn-light{border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#fff}
.car-btn-light:active{background:var(--red);border-color:var(--red);color:#fff}
.rest-slide{flex:0 0 100%;padding:0 20px}
.rest-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.rest-img{aspect-ratio:16/9;background:#111;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.rest-img img.logo-in{width:96px;height:96px;object-fit:contain;border-radius:12px}
.rest-img img.hero-in{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.rest-info{padding:22px}
.rest-name{font-family:var(--font-serif);font-size:26px;font-weight:700;color:var(--black);margin-bottom:6px}
.rest-addr{font-size:12px;color:rgba(0,0,0,.45);margin-bottom:18px}
.rest-cta{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--red);border-bottom:1px solid var(--red);padding-bottom:2px;display:inline-flex;gap:6px}
.dish-slide{flex:0 0 80%;padding:0 8px}
.dish-slide:first-child{padding-left:20px}.dish-slide:last-child{padding-right:20px}
.dish-card{border-radius:16px;overflow:hidden;position:relative;aspect-ratio:.82;background:#1a1a1a}
.dish-ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dish-ph-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#2a2622,#141210)}
.dish-ph-empty svg{width:54px;height:54px;opacity:.4;color:var(--gold)}
.dish-card-body{position:absolute;bottom:0;left:0;right:0;padding:18px 18px 16px;background:linear-gradient(to top,rgba(0,0,0,.92) 12%,rgba(0,0,0,.45) 60%,transparent 100%)}
.dish-card-name{font-family:var(--font-serif);font-size:21px;font-weight:700;color:#fff;margin-bottom:4px;line-height:1.1}
.dish-card-desc{font-size:12px;color:rgba(255,255,255,.72);line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dish-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dish-card-price{font-size:16px;font-weight:600;color:var(--gold)}
.alg-row{display:flex;gap:4px;flex-wrap:wrap}
.alg-chip{font-size:13px;line-height:1;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12)}
.rev-slide{flex:0 0 88%;padding:0 8px}
.rev-slide:first-child{padding-left:20px}.rev-slide:last-child{padding-right:20px}
.rev-card{background:#1a1a1a;border-radius:16px;padding:24px;border:1px solid rgba(255,255,255,.06)}
.rev-verified{font-size:11px;color:rgba(255,255,255,.35);margin-bottom:10px}
.rev-verified em{color:#4ade80;font-style:normal;font-weight:600}
.rev-stars{color:#f59e0b;font-size:18px;letter-spacing:2px;margin-bottom:14px}
.rev-text{font-size:14px;line-height:1.7;color:rgba(255,255,255,.82);margin-bottom:16px}
.rev-author{font-size:12px;color:rgba(255,255,255,.35)}
.insta-slide{flex:0 0 46%;padding:0 5px}
.insta-slide:first-child{padding-left:20px}.insta-slide:last-child{padding-right:20px}
.insta-card{border-radius:12px;overflow:hidden;aspect-ratio:1;position:relative;background:#1a1a1a;display:block}
.insta-card img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.insta-handle-label{position:absolute;bottom:10px;left:12px;font-size:12px;font-weight:500;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.insta-note{max-width:560px;margin:18px auto 0;padding:0 20px;font-size:14px;line-height:1.7;color:rgba(255,255,255,.82);text-align:center;white-space:pre-wrap}
.r-where{background:var(--cream);color:var(--black);padding:60px 0}
.r-map{max-width:760px;margin:0 auto 26px;padding:0 20px}
.r-map-frame{border-radius:16px;overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.12);aspect-ratio:16/10;border:0;width:100%}
.r-meta{max-width:620px;margin:0 auto;padding:0 24px;display:grid;gap:22px}
.r-meta h4{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.r-meta p,.r-meta li{font-size:14px;line-height:1.7;color:#333}
.r-hours{list-style:none;display:grid;gap:6px}
.r-hours li{display:flex;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,.07);padding-bottom:6px}
.r-hours li.closed span:last-child{color:var(--red);font-weight:600}
.r-hours li.today{font-weight:700}
.tool-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px;padding:0 20px}
.tool-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:12px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--black);color:#fff}
.tool-btn.gold{background:var(--gold);color:var(--black)}
.tool-btn.red{background:var(--red);color:#fff}
.tool-btn.smenu-btn{background:#faf7f0;color:#7a6234;border:1px solid rgba(181,152,106,.55)}
.sm-ov{position:fixed;inset:0;z-index:1500;background:rgba(20,16,10,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.sm-card{position:relative;max-width:440px;width:100%;max-height:92vh;border-radius:8px;box-shadow:0 28px 70px rgba(0,0,0,.45);font-family:var(--sm-font,inherit);overflow:hidden;border:1px solid color-mix(in srgb,var(--sm-accent) 45%,transparent);--sm-print-scale:1}
.sm-card::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 420px 300px at 12% -8%,color-mix(in srgb,var(--sm-accent) 22%,transparent),transparent 60%),radial-gradient(ellipse 420px 300px at 88% 108%,color-mix(in srgb,var(--sm-accent) 22%,transparent),transparent 60%),repeating-linear-gradient(135deg,color-mix(in srgb,var(--sm-accent) 4%,transparent) 0 2px,transparent 2px 26px);pointer-events:none;z-index:0}
.sm-frame{position:relative;z-index:1;margin:14px;border:1px solid var(--sm-accent);border-radius:2px;box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--sm-accent) 8%,transparent);padding:44px 22px 30px;text-align:center;max-height:calc(92vh - 28px);overflow-y:auto}
.sm-card-photo{overflow:visible;border:none;box-shadow:none;background:none}
.sm-card-photo::before{display:none}
.sm-photo-banner{width:100%;background-size:contain;background-position:center;background-repeat:no-repeat;background-color:var(--sm-bg,#fff);position:relative;border-radius:8px;overflow:hidden;box-shadow:0 28px 70px rgba(0,0,0,.45)}
.sm-frame-photo{position:absolute;margin:0;border:none;box-shadow:none;border-radius:4px;padding:2%;max-height:none;overflow-y:auto;display:flex;flex-direction:column;justify-content:flex-start;background:color-mix(in srgb,var(--sm-bg) 55%,transparent);backdrop-filter:blur(1px)}
.sm-frame-photo .sm-title{font-size:calc(clamp(11px,3.4vw,22px) * var(--sm-print-scale,1));margin-bottom:4px}
.sm-frame-photo .sm-rule{margin-bottom:8px;font-size:calc(8px * var(--sm-print-scale,1))}
.sm-frame-photo .sm-cats{gap:calc(6px * var(--sm-print-scale,1))}
.sm-frame-photo .sm-cat-name{font-size:calc(clamp(10px,2.6vw,16px) * var(--sm-print-scale,1))}
.sm-frame-photo .sm-cat-items{font-size:calc(clamp(8px,2vw,12px) * var(--sm-print-scale,1))}
.sm-close{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.07);color:inherit;font-size:14px;line-height:1;border:none;cursor:pointer}
.sm-print{position:absolute;top:8px;right:46px;z-index:2;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.07);color:inherit;font-size:14px;line-height:1;border:none;cursor:pointer}
.sm-corner{position:absolute;line-height:1;z-index:0;display:flex;align-items:center;opacity:.96;filter:drop-shadow(0 3px 4px rgba(0,0,0,.14))}
.sm-corner-tl,.sm-corner-br{font-size:34px}
.sm-corner-tr,.sm-corner-bl{font-size:17px;opacity:.8}
.sm-corner-tl{top:-9px;left:-9px}
.sm-corner-br{bottom:-9px;right:-9px;transform:scale(-1)}
.sm-corner-tr{top:-2px;right:-2px;transform:scaleX(-1)}
.sm-corner-bl{bottom:-2px;left:-2px;transform:scaleY(-1)}
.sm-title{font-family:'Dancing Script',var(--font-serif);font-size:calc(32px * var(--sm-print-scale,1));line-height:1.25;margin:0 0 calc(12px * var(--sm-print-scale,1));color:var(--sm-accent);font-weight:700}
.sm-rule{color:var(--sm-accent);font-size:calc(11px * var(--sm-print-scale,1));letter-spacing:.5em;opacity:.75;margin-bottom:calc(24px * var(--sm-print-scale,1));display:flex;align-items:center;justify-content:center;gap:10px}
.sm-rule::before,.sm-rule::after{content:"";width:34px;height:1px;background:currentColor;opacity:.55}
.sm-cats{display:flex;flex-direction:column;gap:calc(19px * var(--sm-print-scale,1))}
.sm-cat-name{display:block;font-family:'Dancing Script',var(--font-serif);font-size:calc(22px * var(--sm-print-scale,1));font-weight:700;letter-spacing:.01em;color:var(--sm-accent)}
.sm-cat-price{display:inline-block;margin-top:3px;font-size:calc(11.5px * var(--sm-print-scale,1));letter-spacing:.08em;padding:2px 10px;border:1px solid color-mix(in srgb,var(--sm-accent) 55%,transparent);border-radius:20px;opacity:.9}
.sm-dish-price{font-size:.92em;opacity:.75;white-space:nowrap}
.sm-cat-items{font-size:calc(12.5px * var(--sm-print-scale,1));line-height:1.65;opacity:.82;margin-top:5px}
.sm-note{font-size:calc(11.5px * var(--sm-print-scale,1));opacity:.72;margin-top:calc(22px * var(--sm-print-scale,1));padding-top:calc(13px * var(--sm-print-scale,1));border-top:1px solid var(--sm-accent);font-style:italic}
.sm-total{margin-top:calc(22px * var(--sm-print-scale,1));padding:calc(16px * var(--sm-print-scale,1)) 12px calc(4px * var(--sm-print-scale,1));border-top:1px solid var(--sm-accent);position:relative}
.sm-total::before{content:"❦";position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--sm-bg);padding:0 10px;font-size:13px;color:var(--sm-accent)}
.sm-total-lbl{display:block;font-size:calc(10.5px * var(--sm-print-scale,1));letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-bottom:5px}
.sm-total-amt{display:block;font-family:var(--font-serif);font-size:calc(23px * var(--sm-print-scale,1));font-weight:700;color:var(--sm-accent)}
footer{background:var(--black);border-top:1px solid rgba(255,255,255,.06);padding:30px 20px;text-align:center}
.ft-copy{font-size:11px;color:rgba(255,255,255,.3);line-height:2}
.ft-copy a{color:rgba(255,255,255,.45);border-bottom:1px solid rgba(255,255,255,.15)}

/* Traduzione automatica al volo (contenuti liberi: piatti, menu di lavoro, menu speciale).
   La sorgente è sempre l'italiano inserito dai gestori; usiamo MyMemory (nessuna chiave richiesta)
   con cache persistente in localStorage per non ritradurre lo stesso testo ad ogni visita. */
var TR_CACHE=(function(){try{return JSON.parse(localStorage.getItem('fkTrCache')||'{}');}catch(e){return {};}})();
function trCacheSave(){try{localStorage.setItem('fkTrCache',JSON.stringify(TR_CACHE));}catch(e){}}
function translateText(text,lang){
  text=String(text==null?'':text).trim();
  if(!text||lang==='it')return Promise.resolve(text);
  var key=lang+'|'+text;
  if(TR_CACHE[key])return Promise.resolve(TR_CACHE[key]);
  return fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=it|'+lang)
    .then(function(r){return r.json();})
    .then(function(j){
      var out=(j&&j.responseData&&j.responseData.translatedText)?j.responseData.translatedText:text;
      if(!out||/MYMEMORY WARNING|QUOTA/i.test(out))out=text;
      TR_CACHE[key]=out;trCacheSave();
      return out;
    })
    .catch(function(){return text;});
}
/* Traduce in background tutti gli elementi [data-i18n-auto] dentro root, senza bloccare il render iniziale
   (che mostra subito il testo italiano originale). Concorrenza limitata per non intasare l'API gratuita. */
function translateAutoNodes(root){
  if(LANG==='it')return;
  var nodes=Array.prototype.slice.call((root||document).querySelectorAll('[data-i18n-auto]')).filter(function(el){return el.getAttribute('data-tr-lang')!==LANG;});
  var i=0,CONC=6;
  function next(){
    if(i>=nodes.length)return;
    var batch=nodes.slice(i,i+CONC);i+=CONC;
    Promise.all(batch.map(function(el){
      var src=el.getAttribute('data-orig');
      if(src==null){src=el.textContent;el.setAttribute('data-orig',src);}
      return translateText(src,LANG).then(function(out){el.textContent=out;el.setAttribute('data-tr-lang',LANG);});
    })).then(next);
  }
  next();
}
function esc(s){return String(s==null?'':s).replace(/[<>&"']/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c];});}
/* In Italia i decimali si scrivono con la virgola ("12,50"). Con <input type=number>
   il browser scarta il valore e .value torna vuoto: il prezzo diventava 0 senza avvisare.
   I campi importo usano type=text + inputmode=decimal e passano da qui. */
function numf(v){v=String(v==null?'':v).replace(/[\s €]/g,'').replace(',','.');var n=parseFloat(v);return isFinite(n)?n:NaN;}
function numVal(id){var n=numf(val(id));return isFinite(n)?n:0;}
/* I colori finiscono dentro il CSS della pagina pubblica: accetta solo #rgb / #rrggbb. */
function safeColor(c){return /^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(String(c||'').trim())?String(c).trim():'';}
function priceFmt(p){if(p==null||p==='')return '';var n=parseFloat(p);return '€ '+(isNaN(n)?p:n.toFixed(2).replace('.',','));}
function stars(n){return '\u2605'.repeat(Math.max(1,Math.min(5,n||5)));}
function digits(s){return String(s||'').replace(/[^0-9+]/g,'');}
function parseJson(v,d){if(!v)return d;if(typeof v==='object')return v;try{return JSON.parse(v);}catch(e){return d;}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function getPageType(){var qs=new URLSearchParams(location.search);if(qs.get('admin'))return 'admin';if(qs.get('sub'))return qs.get('sub');var host=location.hostname;if(host.indexOf('admin')!==-1)return 'admin';if(host==='fkpizza.com'||host==='www.fkpizza.com'||host==='localhost'||host==='127.0.0.1'||host.indexOf('vercel.app')!==-1)return 'homepage';return host.split('.')[0];}

function fkStore(){return localStorage.getItem('fkRemember')==='0'?sessionStorage:localStorage;}
function getJwt(){return fkStore().getItem('fkJwt')||SB.KEY;}
function getRefreshTok(){return fkStore().getItem('fkJwtR')||'';}
function setAuthSession(access,refresh,remember){
  var keep=remember!==false;
  localStorage.setItem('fkRemember',keep?'1':'0');
  var store=keep?localStorage:sessionStorage;
  var other=keep?sessionStorage:localStorage;
  other.removeItem('fkJwt');other.removeItem('fkJwtR');other.removeItem('adminAuth');
  store.setItem('fkJwt',access);
  if(refresh)store.setItem('fkJwtR',refresh);
}
function clearAuthSession(){['fkJwt','fkJwtR','adminAuth'].forEach(function(k){localStorage.removeItem(k);sessionStorage.removeItem(k);});localStorage.removeItem('fkRemember');}
function jwtExpMs(tok){try{var part=tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');while(part.length%4)part+='=';var p=JSON.parse(atob(part));return (p.exp||0)*1000;}catch(e){return 0;}}
var FK_REFRESHING=null;
async function refreshAuthSession(){
  if(FK_REFRESHING)return FK_REFRESHING;
  FK_REFRESHING=(async function(){
    var rt=getRefreshTok();if(!rt)throw new Error('no refresh token');
    var res=await fetch(SB.URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB.KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});
    if(!res.ok)throw new Error('refresh failed');
    var d=await res.json();
    setAuthSession(d.access_token,d.refresh_token,localStorage.getItem('fkRemember')!=='0');
    return d.access_token;
  })();
  try{return await FK_REFRESHING;}finally{FK_REFRESHING=null;}
}
async function ensureFreshSession(){
  var tok=fkStore().getItem('fkJwt');if(!tok)return;
  var exp=jwtExpMs(tok);
  if(exp&&exp-Date.now()<5*60*1000){try{await refreshAuthSession();}catch(e){clearAuthSession();}}
}

function cacheSet(k,v){try{sessionStorage.setItem('fkc_'+k,JSON.stringify({t:Date.now(),v:v}));}catch(e){}}

    '</div>';

  document.getElementById('mlp-close').onclick=closeMediaPicker;

    var items=await mlList();

var CAROUSELS=[];
function attachCarousel(scrollId,prevId,nextId,autoMs,refill){var sc=document.getElementById(scrollId);if(!sc)return;var index=0,timer=null;
function tk(){return sc.querySelector('.car-track');}
function count(){var t=tk();return t?t.children.length:0;}
function apply(){var t=tk();if(!t||!t.children.length)return;var n=t.children.length;if(index>=n)index=0;if(index<0)index=n-1;var x=0;for(var i=0;i<index;i++)x+=t.children[i].getBoundingClientRect().width;t.style.transform='translateX('+(-x)+'px)';}
function go(d){var n=count();if(n<1)return;index=index+d;if(index>=n){index=0;if(refill){refill();}}else if(index<0){index=n-1;}apply();}
function start(){stop();if(!autoMs||count()<2)return;timer=setInterval(function(){if(!document.hidden)go(1);},autoMs);}
function stop(){if(timer){clearInterval(timer);timer=null;}}
function bump(){stop();start();}
var prev=document.getElementById(prevId),next=document.getElementById(nextId);
if(prev)prev.onclick=function(e){e.preventDefault();go(-1);bump();};
if(next)next.onclick=function(e){e.preventDefault();go(1);bump();};
var x0=null,y0=null;
sc.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;stop();},{passive:true});
sc.addEventListener('touchend',function(e){if(x0!==null){var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))go(dx<0?1:-1);}x0=null;y0=null;start();},{passive:true});
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(apply,150);});
CAROUSELS.push({apply:apply,start:start});}
function startAllCarousels(){CAROUSELS.forEach(function(c){c.apply();c.start();});}
document.addEventListener('visibilitychange',function(){if(!document.hidden)startAllCarousels();});

function fastTotal(){var t=0;Object.keys(FAST.cart).forEach(function(k){var c=FAST.cart[k];t+=c.qty*(c.price||0);});return t;}

function setQty(key,name,price,delta,pizzaRequired){
  var wasEmpty=fastCount()===0;
  var cur=FAST.cart[key]||{name:name,price:price||0,qty:0};
  if(pizzaRequired)cur.pizzaRequired=true;
  cur.qty+=delta;if(cur.qty<0)cur.qty=0;
  if(cur.qty===0)delete FAST.cart[key];else FAST.cart[key]=cur;
  var st=document.querySelector('.fkmenu-sec .fk-step[data-key="'+key+'"] .fk-qty');if(st)st.textContent=cur.qty;
  refreshFastUI();
  if(wasEmpty&&fastCount()>0)toggleRecap(true);
}
function refreshFastUI(){
  var n=fastCount();
  var bar=document.querySelector('.fk-cartbar');
  if(bar){bar.querySelector('.lbl').textContent=n+' '+(n===1?'piatto':'piatti');bar.querySelector('.tot').textContent=priceFmt(fastTotal());}
  var send=document.querySelector('.fk-send');if(send)send.disabled=(n<1);
  renderRecap();
}

    });
    root.addEventListener('change',function(e){
      var wmSel=e.target.closest('.fk-wm-pizza');
      if(wmSel){FAST.wmChoices=FAST.wmChoices||{};FAST.wmChoices[wmSel.getAttribute('data-key')]=wmSel.value;return;}
      var ck=e.target.closest('.fk-custom-ck');if(!ck)return;
      var note=root.querySelector('.fk-custom-note[data-key="'+ck.getAttribute('data-key')+'"]');
      if(note){note.classList.toggle('show',ck.checked);if(!ck.checked){note.value='';delete FAST.notes[ck.getAttribute('data-key')];}}
    });

}

async function submitFastOrder(R){
  var missingPizza=Object.keys(FAST.cart).some(function(k){var c=FAST.cart[k];return c.qty>0&&c.pizzaRequired&&!(FAST.wmChoices&&FAST.wmChoices[k]);});
  if(missingPizza){alert(LANG==='it'?'Scegli la pizza per il Menu Pizza prima di inviare.':'Choose the pizza for the Pizza Menu before sending.');return;}
  var items=[];Object.keys(FAST.cart).forEach(function(k){var c=FAST.cart[k];if(c.qty>0){var note=(FAST.notes&&FAST.notes[k])||'';var pizzaChoice=(c.pizzaRequired&&FAST.wmChoices&&FAST.wmChoices[k])||'';if(pizzaChoice)note=note?(note+' | Pizza: '+pizzaChoice):('Pizza: '+pizzaChoice);var it={name:c.name,qty:c.qty,price:c.price,note:note};if(k.indexOf('wm_')===0)it.kind='workmenu';items.push(it);}});
  if(!items.length){alert(t('needitems'));return;}
  var isAsporto=FAST.mode==='asporto';
  var body={restaurant_id:R.id,order_type:FAST.mode,items:items,total:fastTotal(),source:'customer',status:'new'};
  if(isAsporto){
    if(!FAST.phone){alert(t('needphone'));return;}
    if(!FAST.name){alert(t('needname'));return;}
    if(!FAST.deliveryTime){alert(t('needtime'));return;}
    if(!FAST.privacyConsent){alert('Devi accettare l\'informativa privacy per procedere.');return;}
    body.customer_phone=FAST.phone;body.customer_name=FAST.name;body.delivery_time=FAST.deliveryTime;if(FAST.email)body.customer_email=FAST.email;body.privacy_consent=!!FAST.privacyConsent;body.marketing_consent=!!FAST.marketingConsent;
  }else{
    if(!FAST.table){alert(t('needtable'));return;}
    if(!fastAllowed(R)){alert(t('fastexpired'));return;}
    body.table_number=FAST.table;body.people=parseInt(FAST.people,10)||null;
    var loyPhone=FAST.phone||loyGetPhone(R);if(loyPhone)body.customer_phone=loyPhone;
    body.client_token=loyPhone?('p:'+loyPhone):('d:'+deviceToken());
  }
  var goldPhones=(FAST.goldPhones||[]).map(function(s){return (s||'').trim();}).filter(Boolean);
  if(goldPhones.length)body.gold_split_phones=goldPhones;
  var claimIds=Object.keys(FAST.cart).filter(function(k){return k.indexOf('loyreward_')===0;}).map(function(k){return k.slice('loyreward_'.length);});
  if(claimIds.length)body.claim_reward_ids=claimIds;
  var send=document.getElementById('fk-send');if(send){send.disabled=true;send.textContent='...';}
  try{
    if(!isAsporto){
      try{
        var lastToken=await sbRpc('fk_table_active_identity',{p_restaurant:R.id,p_table:FAST.table});
        if(lastToken&&lastToken!==body.client_token)body.new_client_at_table=true;
      }catch(e){}
    }
    await orderInsert(body);
    if(isAsporto)saveContactInfo(R,{phone:FAST.phone,name:FAST.name,email:FAST.email,privacy:FAST.privacyConsent,marketing:FAST.marketingConsent});
    closeModal();showOrderConfirmation(body,items,isAsporto,R);
  }catch(e){if(send){send.disabled=false;send.textContent=t('sendorder');}alert('Errore invio ordine. Riprova.');}
}

/* ----- Ritorno al menu dopo un ordine: ruota della fortuna + recensione ----- */
function tableOrderCountKey(R,table){return 'fkordn_'+((R&&R.id)||'x')+'_'+String(table||'');}
function bumpTableOrderCount(R,table){
  var k=tableOrderCountKey(R,table);
  var raw=null;try{raw=JSON.parse(localStorage.getItem(k)||'null');}catch(e){}
  var n=(raw&&raw.n)||0,ts=(raw&&raw.ts)||0;
  if(!ts||Date.now()-ts>4*3600000)n=0;
  n++;
  try{localStorage.setItem(k,JSON.stringify({n:n,ts:Date.now()}));}catch(e){}
  return n;
}
function reviewShownKey(R){return 'fkreviewed_'+((R&&R.id)||'x');}
function loyReviewShown(R){try{return !!localStorage.getItem(reviewShownKey(R));}catch(e){return false;}}
function loyMarkReviewShown(R){try{localStorage.setItem(reviewShownKey(R),'1');}catch(e){}}
function afterTableOrderClosed(R,table,people){
  var n=bumpTableOrderCount(R,table);
  var resume={table:String(table||''),people:people?String(people):''};
  if(n===1){
    openRuotaModal(R,function(prizeItem){
      if(prizeItem){resume.prizeKey='ruota_'+Date.now();resume.prizeItem=prizeItem;}
      openWebMenu(R,LAST_MENU_DISHES,'fast',resume);
    });
  }else if(n===2&&!loyReviewShown(R)){
    openReviewPopup(R,function(){openWebMenu(R,LAST_MENU_DISHES,'fast',resume);});
  }else{
    openWebMenu(R,LAST_MENU_DISHES,'fast',resume);
  }
}
async function openRuotaModal(R,onDone){
  var host=document.createElement('div');
  host.className='rw-ov';host.id='rw-ov';
  host.innerHTML='<div class="rw-card"><div class="rw-loading">'+(LANG==='it'?'Carico la ruota…':'Loading the wheel…')+'</div></div>';
  document.body.appendChild(host);
  var premi=[],cfg={};
  try{
    premi=await sbFetch('ruota_premi','?select=*&order=posizione.asc');
    var cfgRows=await sbFetch('ruota_config','?select=*&limit=1');
    cfg=(cfgRows&&cfgRows[0]&&cfgRows[0].valori)||{};
  }catch(e){}
  var visibili=(premi||[]).filter(function(p){return p.attivo!==false;});
  if(visibili.length<2){host.remove();onDone(null);return;}
  renderRuotaWheel(host,visibili,cfg,R,onDone);
}
function renderRuotaWheel(host,premi,cfg,R,onDone){
  var n=premi.length,step=360/n;
  var gradient=premi.map(function(p,i){return (p.colore||'#24282A')+' '+(i*step)+'deg '+((i+1)*step)+'deg';}).join(',');
  var slices=premi.map(function(p,i){
    var mid=i*step+step/2;
    return '<div class="rw-slice" style="transform:rotate('+mid+'deg)"><span class="rw-slice-label">'+esc(p.emoji||'🎁')+' '+esc(p.nome)+'</span></div>';
  }).join('');
  host.innerHTML='<div class="rw-card">'+
    '<p class="rw-eyebrow">'+(LANG==='it'?'Prima di continuare':'Before you continue')+'</p>'+
    '<h3 class="rw-h">'+(LANG==='it'?'Gira la Ruota della Fortuna!':'Spin the Wheel of Fortune!')+'</h3>'+
    '<div class="rw-wrap"><div class="rw-pointer">▼</div><div class="rw-wheel" id="rw-wheel" style="background:conic-gradient('+gradient+')">'+slices+'</div></div>'+
    '<button type="button" class="rw-spin" id="rw-spin">'+(LANG==='it'?'GIRA':'SPIN')+'</button>'+
    '<div class="rw-result" id="rw-result" style="display:none"></div>'+
    '</div>';
  var wheelEl=document.getElementById('rw-wheel');
  var spinBtn=document.getElementById('rw-spin');
  var angle=0;
  spinBtn.onclick=function(){
    spinBtn.disabled=true;
    var idonei=premi.map(function(p,i){return {p:p,i:i};}).filter(function(x){return x.p.peso>0&&(x.p.scorta==null||x.p.scorta>0);});
    if(!idonei.length){finishSpin(null);return;}
    var totale=idonei.reduce(function(s,x){return s+x.p.peso;},0);
    var r=Math.random()*totale,scelto=idonei[idonei.length-1];
    for(var k=0;k<idonei.length;k++){r-=idonei[k].p.peso;if(r<=0){scelto=idonei[k];break;}}
    var giri=cfg.giri||6,durata=(cfg.durata||6.5)*1000;
    var centro=scelto.i*step+step/2;
    var scarto=(Math.random()-.5)*step*.6;
    var partenza=angle;
    var arrivo=Math.ceil(angle/360)*360+giri*360-centro-scarto;
    var avvio=null;
    function ease(t){return 1-Math.pow(1-t,4);}
    function frame(ts){
      if(!avvio)avvio=ts;
      var t=Math.min((ts-avvio)/durata,1);
      angle=partenza+(arrivo-partenza)*ease(t);
      wheelEl.style.transform='rotate('+angle+'deg)';
      if(t<1)requestAnimationFrame(frame);
      else finishSpin(scelto.p);
    }
    requestAnimationFrame(frame);
  };
  function finishSpin(prize){
    var resBox=document.getElementById('rw-result');
    resBox.style.display='block';
    if(!prize||prize.non_vincente){
      resBox.innerHTML='<p class="rw-lost">'+(LANG==='it'?'Non hai vinto questa volta. Alla prossima!':'No luck this time. See you next time!')+'</p>'+
        '<button type="button" class="rw-continue" id="rw-continue">'+(LANG==='it'?'Continua':'Continue')+'</button>';
    }else{
      resBox.innerHTML='<p class="rw-won">🎉 '+(LANG==='it'?'Hai vinto':'You won')+': <b>'+esc(prize.emoji||'🎁')+' '+esc(prize.nome)+'</b>!</p>'+
        '<p class="rw-wonnote">'+(LANG==='it'?'Il premio è stato aggiunto al tuo prossimo ordine.':'The prize has been added to your next order.')+'</p>'+
        '<button type="button" class="rw-continue" id="rw-continue">'+(LANG==='it'?'Continua':'Continue')+'</button>';
      registraVincitaRuota(prize,R);
    }
    document.getElementById('rw-continue').onclick=function(){
      host.remove();
      onDone(prize&&!prize.non_vincente?{name:'🎁 '+prize.nome,price:0,qty:1,kind:'ruota_premio'}:null);
    };
  }
}
function registraVincitaRuota(prize,R){
  var codice='FK-'+Math.random().toString(36).slice(2,7).toUpperCase();
  var contatto=loyGetPhone(R)||null;
  fetch(SB.URL+'/rest/v1/ruota_vincite',{method:'POST',headers:{apikey:SB.KEY,Authorization:'Bearer '+SB.KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({premio:prize.nome,codice:codice,contatto:contatto,riscattato:true})}).catch(function(){});
}

}

async function submitInlineLoyaltyRegistration(R){

  var errBox=document.getElementById('loyi-form-err');errBox.style.display='none';
  if(!name||!phone||!email){errBox.textContent=lt('needfields');errBox.style.display='block';return;}
  if(!c1||!c2)return;

function smPrintFit(){
  var card=document.querySelector('#sm-ov .sm-card');
  if(!card){window.print();return;}
  card.style.setProperty('--sm-print-scale','1');
  var mmToPx=96/25.4;
  var pageH=(297-24)*mmToPx,pageW=(210-24)*mmToPx;
  var clone=card.cloneNode(true);
  clone.removeAttribute('id');
  var cId=clone.querySelector('#sm-close');if(cId)cId.removeAttribute('id');
  var pId=clone.querySelector('#sm-print');if(pId)pId.removeAttribute('id');
  clone.style.position='fixed';clone.style.left='-9999px';clone.style.top='0';
  clone.style.maxWidth='none';clone.style.width=pageW+'px';clone.style.maxHeight='none';
  document.body.appendChild(clone);
  var frame=clone.querySelector('.sm-frame');
  var scale=1;
  if(frame){
    frame.style.maxHeight='none';frame.style.overflow='visible';
    var neededH=frame.scrollHeight;
    var isPhoto=clone.classList.contains('sm-card-photo');
    var availH=isPhoto?frame.getBoundingClientRect().height:(pageH-30);
    if(neededH>availH)scale=Math.max(.55,availH/neededH);
  }
  document.body.removeChild(clone);
  card.style.setProperty('--sm-print-scale',String(scale));
  window.print();
  var reset=function(){card.style.setProperty('--sm-print-scale','1');window.removeEventListener('afterprint',reset);};
  window.addEventListener('afterprint',reset);
}

function eseguiCalcoloCostoPiatto(){
  var alKg=document.getElementById('cp_alkg').checked;
  var nome=val('cp_nome')||'Piatto';
  var qta=Math.max(1,parseInt(val('cp_qta'),10)||1);
  var sconto=Math.min(100,Math.max(0,numVal('cp_sconto')));
  var dettaglio=[];
  var unitario=0;
  if(alKg){
    var prezzoKg=numVal('cp_prezzokg');
    var pesoG=numVal('cp_peso');
    if(pesoG<=0){alert('Inserisci un peso in grammi maggiore di zero.');return;}
    unitario=prezzoKg*(pesoG/1000);
    dettaglio.push({voce:nome+' ('+pesoG+'g)',prezzo:unitario});
  } else {
    var base=numVal('cp_prezzo');
    if(base)dettaglio.push({voce:nome,prezzo:base});
    unitario=base;
  }
  var varNome=val('cp_var_nome');
  var varPrezzo=numf(val('cp_var_prezzo'));
  if(varNome&&!isNaN(varPrezzo)){unitario+=varPrezzo;dettaglio.push({voce:varNome,prezzo:varPrezzo});}
  CPZ.extra.forEach(function(ex){
    if(ex.productId){
      var prod=CPZ.products.find(function(p){return p.id===ex.productId;});
      if(!prod)return;
      var qty=numf(ex.qty);
      if(!qty)return;
      var cost=Math.round((prod.cost||0)*qty*100)/100;
      unitario+=cost;
      dettaglio.push({voce:prod.name+' ('+qty+' '+prod.unit+')',prezzo:cost});
    } else {
      var ep=numf(ex.prezzo);
      if(ex.nome&&isFinite(ep)&&ep!==0){unitario+=ep;dettaglio.push({voce:ex.nome,prezzo:ep});}
    }
  });
  if(!dettaglio.length){alert('Aggiungi almeno un ingrediente o un prezzo base.');return;}
  var totale=unitario*qta;
  if(sconto>0){var scontoVal=totale*(sconto/100);totale-=scontoVal;dettaglio.push({voce:'Sconto '+sconto+'%',prezzo:-scontoVal});}
  totale=Math.round(totale*100)/100;
  unitario=Math.round(unitario*100)/100;
  var html='<div class="wt-card">'+
    dettaglio.map(function(d){return '<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:'+(d.prezzo<0?'var(--adm-success)':'var(--adm-text)')+'"><span>'+esc(d.voce)+'</span><span>'+(d.prezzo<0?'− ':'')+priceFmt(Math.abs(d.prezzo))+'</span></div>';}).join('')+
    '<div style="display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin-top:8px;padding-top:8px;border-top:1px solid var(--adm-line)"><span>Totale ('+qta+' pz)</span><span>'+priceFmt(totale)+'</span></div>'+
    (qta>1?'<div style="text-align:right;font-size:12px;color:var(--adm-text-dim);margin-top:2px">'+priceFmt(unitario)+' cad.</div>':'')+
    '</div>';
  document.getElementById('cp_result').innerHTML=html;
}

function orderElapsed(createdAt){

  if(mins<1)return t('justarrived');
  if(mins<60)return t('waitingfor')+' '+mins+'m';

  return t('waitingfor')+' '+h+'h'+(m?(' '+m+'m'):'');

function fmtWaitMins(mins){if(mins<60)return mins+'m';var h=Math.floor(mins/60),m=mins%60;return h+'h'+(m?(' '+m+'m'):'');}
function archiveRangeStart(range){
  var d=new Date();
  if(range==='day'){d.setHours(0,0,0,0);return d;}
  if(range==='week'){var wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);d.setHours(0,0,0,0);return d;}
  if(range==='month'){d.setDate(1);d.setHours(0,0,0,0);return d;}
  if(range==='year'){d.setMonth(0,1);d.setHours(0,0,0,0);return d;}
  return null;
}

async function loadOrderArchive(){

  body.innerHTML=statsHtml+'<div class="wt-orders">'+rows.map(function(o){

function mondayOf(d){d=new Date(d);var day=d.getDay();var diff=(day===0?-6:1-day);var m=new Date(d);m.setDate(d.getDate()+diff);m.setHours(0,0,0,0);return m;}

function ensureZXing(){return new Promise(function(res,rej){if(window.ZXing)return res();var sc=document.createElement('script');sc.src='https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js';sc.onload=function(){res();};sc.onerror=function(){rej();};document.head.appendChild(sc);});}
function ensureJsPDF(){return new Promise(function(res,rej){if(window.jspdf)return res();var sc=document.createElement('script');sc.src='https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js';sc.onload=function(){res();};sc.onerror=function(){rej();};document.head.appendChild(sc);});}
async function openBarcodeScanner(onDetect){
  var host=document.createElement('div');host.id='bcs-host';
  host.style.cssText='position:fixed;inset:0;z-index:2100;background:#000;display:flex;flex-direction:column;color-scheme:light';
  host.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--adm-surface)"><h3 style="margin:0;color:var(--adm-accent2-text);font-family:var(--font-serif);font-size:18px">Scansiona codice a barre</h3><button type="button" id="bcs-close" style="width:36px;height:36px;border-radius:10px;background:var(--adm-surface2);color:var(--adm-text);font-size:20px;flex-shrink:0">&times;</button></div>'+
    '<div style="flex:1;position:relative;overflow:hidden;min-height:200px;background:#000"><video id="bcs-video" playsinline autoplay muted style="width:100%;height:100%;object-fit:cover"></video><div style="position:absolute;inset:15% 8%;border:3px solid var(--adm-accent2);border-radius:14px;pointer-events:none"></div></div>'+
    '<div style="padding:14px 16px;background:var(--adm-surface)"><p class="muted" id="bcs-status" style="text-align:center">Inquadra il codice a barre del prodotto</p><div class="field" style="margin-top:10px;margin-bottom:0"><input id="bcs-manual" placeholder="oppure digita il codice qui"></div><button class="mbtn gold" id="bcs-manual-go" style="max-width:280px;margin:8px auto 0">Usa codice digitato</button></div>';
  document.body.appendChild(host);
  var stream=null,stopped=false,zxingReader=null;
  function cleanup(){stopped=true;if(stream)stream.getTracks().forEach(function(t){t.stop();});if(zxingReader){try{zxingReader.reset();}catch(e){}}host.remove();}
  document.getElementById('bcs-close').onclick=cleanup;
  document.getElementById('bcs-manual-go').onclick=function(){var v=document.getElementById('bcs-manual').value.trim();if(v){cleanup();onDetect(v);}};
  var video=document.getElementById('bcs-video');
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});}
  catch(e){var st=document.getElementById('bcs-status');if(st)st.textContent='Fotocamera non disponibile. Digita il codice manualmente.';return;}
  video.srcObject=stream;
  /* NIENTE video.play() qui: ZXing gestisce da solo l'avvio del video (aspetta
     l'evento 'playing' prima di iniziare a decodificare). Se il video sta gia'
     suonando quando glielo passiamo, quell'evento e' gia' passato e non scatta
     piu': la scansione resta bloccata in silenzio per sempre, camera accesa,
     nessun codice letto. Su iPhone (WebKit, niente BarcodeDetector) si passa
     sempre da ZXing, quindi era li' che il problema si vedeva sempre. */
  var startZXing=async function(){
    if(stopped)return;
    try{
      await ensureZXing();
      if(stopped)return;
      zxingReader=new ZXing.BrowserMultiFormatReader();
      zxingReader.decodeFromVideoElementContinuously(video,function(result){if(stopped)return;if(result){var text=result.getText();cleanup();onDetect(text);}});
    }catch(e){var st2=document.getElementById('bcs-status');if(st2)st2.textContent='Scanner non disponibile su questo dispositivo. Digita il codice manualmente.';}
  };
  var usedNative=false;
  if('BarcodeDetector' in window){
    try{
      var formats=await window.BarcodeDetector.getSupportedFormats();
      /* Su alcuni Chrome (soprattutto Linux desktop) l'API esiste ma il servizio
         di rilevamento nativo non e' installato: getSupportedFormats() torna [],
         il costruttore lancia e prima cadevamo in un catch vuoto, fotocamera
         accesa che non leggeva mai nulla. Ora saltiamo dritti a ZXing. */
      if(formats&&formats.length){
        /* Il rilevatore nativo non gestisce da solo la riproduzione: qui il
           video va avviato esplicitamente (a differenza del ramo ZXing sopra). */
        try{await video.play();}catch(e){}
        var detector=new window.BarcodeDetector({formats:formats});
        var giveUpAt=Date.now()+6000;
        var loop=async function(){
          if(stopped)return;
          try{
            var codes=await detector.detect(video);
            if(codes&&codes.length){cleanup();onDetect(codes[0].rawValue);return;}
          }catch(e){}
          /* Se il rilevamento nativo non trova mai nulla entro 6s (servizio
             presente ma non funzionante), passiamo a ZXing invece di restare
             bloccati in silenzio per sempre. */
          /* Bisogna mettere in pausa prima di passare a ZXing: se il video risulta
             gia' in riproduzione, ZXing non lo riavvia e resta bloccato come sopra. */
          if(Date.now()>giveUpAt){try{video.pause();}catch(e){}startZXing();return;}
          requestAnimationFrame(loop);
        };
        loop();usedNative=true;
      }
    }catch(e){}
  }
  if(!usedNative)startZXing();
}

async function buildWarehousePdfBlob(restaurant,products,supById,weekStartStr){
  await ensureJsPDF();
  var doc=new window.jspdf.jsPDF();
  doc.setFontSize(16);doc.text('Report Giacenza Magazzino',14,18);
  doc.setFontSize(11);doc.text(restaurant.name||'',14,26);
  doc.text('Settimana dal '+fmtDateIt(weekStartStr),14,32);
  var y=44;
  doc.setFontSize(9);
  doc.text('Prodotto',14,y);doc.text('Fornitore',90,y);doc.text('Giacenza',140,y);doc.text('Scorta min.',170,y);
  y+=4;doc.line(14,y,196,y);y+=6;
  products.forEach(function(pr){
    if(y>280){doc.addPage();y=20;}
    var low=parseFloat(pr.stock)<=parseFloat(pr.min_stock);
    doc.setTextColor(low?200:20,low?40:20,low?40:20);
    doc.text(String(pr.name||'').slice(0,38),14,y);
    doc.text(String(supById[pr.supplier_id]||'').slice(0,22),90,y);
    doc.text(fmtQty(pr.stock)+' '+(pr.unit||''),140,y);
    doc.text(fmtQty(pr.min_stock),170,y);
    y+=6;
  });
  doc.setTextColor(20,20,20);
  return doc.output('blob');
}
async function generateAndSaveReport(restaurant,weekStart){
  var supById={};AMAG.suppliers.forEach(function(s){supById[s.id]=s.name;});
  var blob;
  try{blob=await buildWarehousePdfBlob(restaurant,AMAG.products,supById,weekStart);}catch(e){return null;}
  var path=AMAG.rest+'/'+weekStart+'.pdf';
  try{
    await sbStorageUpload('warehouse-reports',path,blob,'application/pdf');
    var res=await sbWrite('POST','warehouse_reports',{restaurant_id:AMAG.rest,week_start:weekStart,pdf_path:path});
    return (res&&res[0])||{restaurant_id:AMAG.rest,week_start:weekStart,pdf_path:path};
  }catch(e){return null;}
}

function parsePastedReview(raw){
  var lines=raw.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  var rating=null;
  var starMatch=raw.match(/[★⭐]{1,5}/);
  if(starMatch)rating=starMatch[0].length;
  if(!rating){var numMatch=raw.match(/(\d(?:[.,]\d)?)\s*(?:su|out of|of|\/)\s*5/i);if(numMatch)rating=Math.round(parseFloat(numMatch[1].replace(',','.')));}
  if(!rating){
    var bubbleWords={eccellente:5,ottimo:4,'very good':4,'nella media':3,average:3,scarso:2,poor:2,pessimo:1,terrible:1,excellent:5};
    var lower=raw.toLowerCase();
    Object.keys(bubbleWords).forEach(function(w){if(lower.indexOf(w)!==-1)rating=bubbleWords[w];});
  }
  if(!rating)rating=5;
  rating=Math.max(1,Math.min(5,rating));
  var noiseRe=/^(ha scritto|wrote a review|recension[ei]|recensito|read more|leggi (di più|tutto)|share|condividi|utile|helpful|\d+\s*(giorni?|settiman[ae]|mes[ei]|ann[oi])\s*fa|\d+\s*(day|week|month|year)s?\s*ago|visitato|ho (mangiato|cenato)|data (della|dell.)\s*esperienza|date of (visit|experience)|\d{1,2}\/\d{1,2}\/\d{2,4}|★+|⭐+|\d(?:[.,]\d)?\s*(?:su|out of|of|\/)\s*5|eccellente|ottimo|nella media|scarso|pessimo|excellent|very good|average|poor|terrible|tripadvisor|google)/i;
  var candLines=lines.filter(function(l){return !noiseRe.test(l)&&l.length>1;});
  var name='';
  if(candLines.length&&candLines[0].length<=40&&candLines[0].split(' ').length<=5){name=candLines[0];candLines=candLines.slice(1);}
  var text=candLines.join(' ').trim()||raw.trim();
  var source='';
  if(/tripadvisor/i.test(raw))source='tripadvisor';else if(/google/i.test(raw))source='google';
  return {name:name,rating:rating,text:text,source:source};
}

async function loadStats(){
  var box=document.getElementById('st-body');if(!box)return;

function renderStatsBody(rows,list){
  if(!rows.length)return '<p class="wt-empty">Nessun ordine nel periodo selezionato.</p>';
  var totalOrders=rows.length;
  var totalRevenue=0;rows.forEach(function(o){totalRevenue+=parseFloat(o.total)||0;});
  var avgOrder=totalOrders?totalRevenue/totalOrders:0;
  var byType={fast:{n:0,rev:0},asporto:{n:0,rev:0}};
  rows.forEach(function(o){var k=o.order_type==='asporto'?'asporto':'fast';byType[k].n++;byType[k].rev+=parseFloat(o.total)||0;});
  var waits=[];rows.forEach(function(o){if(o.completed_at){var w=Math.round((new Date(o.completed_at).getTime()-new Date(o.created_at).getTime())/60000);if(w>=0)waits.push(w);}});
  var avgWait=waits.length?Math.round(waits.reduce(function(a,b){return a+b;},0)/waits.length):null;
  var dishQty={};rows.forEach(function(o){(parseJson(o.items,[])||[]).forEach(function(it){var n=it.name||'?';dishQty[n]=(dishQty[n]||0)+(parseFloat(it.qty||it.quantity)||1);});});
  var topDishes=Object.keys(dishQty).map(function(n){return {name:n,qty:dishQty[n]};}).sort(function(a,b){return b.qty-a.qty;}).slice(0,8);
  var maxDishQty=topDishes.length?topDishes[0].qty:1;
  var hourCounts=new Array(24).fill(0);
  rows.forEach(function(o){try{var h=new Date(o.created_at).getHours();hourCounts[h]++;}catch(e){}});
  var maxHour=Math.max.apply(null,hourCounts)||1;
  var restById={};list.forEach(function(r){restById[r.id]=r.name;});
  var byRest={};rows.forEach(function(o){var n=restById[o.restaurant_id]||'?';byRest[n]=byRest[n]||{n:0,rev:0};byRest[n].n++;byRest[n].rev+=parseFloat(o.total)||0;});
  var restRows=Object.keys(byRest).map(function(n){return {name:n,n:byRest[n].n,rev:byRest[n].rev};}).sort(function(a,b){return b.rev-a.rev;});

  var html='<div class="stat-grid">'+
    '<div class="stat-tile"><div class="n">'+totalOrders+'</div><div class="lbl">Ordini</div></div>'+
    '<div class="stat-tile"><div class="n">'+priceFmt(totalRevenue)+'</div><div class="lbl">Fatturato</div></div>'+
    '<div class="stat-tile"><div class="n">'+priceFmt(avgOrder)+'</div><div class="lbl">Scontrino medio</div></div>'+
    '<div class="stat-tile"><div class="n">'+(avgWait!=null?fmtWaitMins(avgWait):'—')+'</div><div class="lbl">Attesa media</div></div>'+
    '</div>';
  html+='<div class="stat-grid" style="grid-template-columns:1fr 1fr">'+
    '<div class="stat-tile" style="border-left:4px solid var(--adm-accent)"><div class="n">'+byType.fast.n+'</div><div class="lbl">Ristorante · '+priceFmt(byType.fast.rev)+'</div></div>'+
    '<div class="stat-tile" style="border-left:4px solid var(--adm-accent2)"><div class="n">'+byType.asporto.n+'</div><div class="lbl">Asporto · '+priceFmt(byType.asporto.rev)+'</div></div>'+
    '</div>';
  if(topDishes.length){
    html+='<div class="adsub">Piatti più venduti</div>';
    html+=topDishes.map(function(d){var pct=Math.round(d.qty/maxDishQty*100);return '<div class="bar-row"><span class="bar-lbl">'+esc(d.name)+'</span><span class="bar-track"><span class="bar-fill" style="width:'+pct+'%"></span></span><span class="bar-val">'+d.qty+' pz</span></div>';}).join('');
  }
  html+='<div class="adsub">Ordini per fascia oraria</div>';
  html+='<div class="hour-chart">'+hourCounts.map(function(c,h){var pct=Math.max(2,Math.round(c/maxHour*100));return '<div class="hb" title="'+h+':00 — '+c+' ordini" style="height:'+pct+'%"></div>';}).join('')+'</div>';
  html+='<div class="hour-chart-labels">'+[0,4,8,12,16,20].map(function(h){return '<span>'+h+':00</span>';}).join('')+'</div>';
  if(restRows.length>1){
    html+='<div class="adsub">Confronto ristoranti</div>';
    var maxRev=Math.max.apply(null,restRows.map(function(r){return r.rev;}))||1;
    html+=restRows.map(function(r){var pct=Math.round(r.rev/maxRev*100);return '<div class="bar-row"><span class="bar-lbl">'+esc(r.name)+'</span><span class="bar-track"><span class="bar-fill" style="width:'+pct+'%;background:var(--adm-accent2)"></span></span><span class="bar-val">'+priceFmt(r.rev)+'</span></div>';}).join('');
  }
  return html;
}

async function loadMarketing(){
  var box=document.getElementById('mk-body');if(!box)return;
  box.innerHTML='<p class="muted">Caricamento…</p>';
  var list=myRestaurants();
  var ids=AMKT.rest==='all'?list.map(function(r){return r.id;}):[AMKT.rest];
  if(!ids.length){box.innerHTML='<p class="muted">Nessun ristorante disponibile.</p>';return;}
  var restById={};list.forEach(function(r){restById[r.id]=r.name;});
  var rows=[],loyRows=[],settingsRows=[],pendingRows=[];
  try{
    rows=await sbAuthFetch('orders','?restaurant_id=in.('+ids.join(',')+')&customer_phone=not.is.null&select=customer_name,customer_phone,customer_email,restaurant_id,total,created_at,marketing_consent,order_type,items&order=created_at.desc&limit=5000');
    loyRows=await sbAuthFetch('loyalty_members','?restaurant_id=in.('+ids.join(',')+')&select=id,name,phone,email,restaurant_id,marketing_consent,active,silver_stamps,gold_level,credit_balance,created_at');
    settingsRows=await sbAuthFetch('loyalty_settings','?restaurant_id=in.('+ids.join(',')+')&select=restaurant_id,silver_stamps_required');
    pendingRows=await sbAuthFetch('loyalty_pending_rewards','?restaurant_id=in.('+ids.join(',')+')&claimed=eq.false&select=member_id,label');
  }catch(e){box.innerHTML='<p class="muted">Errore nel caricamento.</p>';return;}
  var reqById={};settingsRows.forEach(function(s){reqById[s.restaurant_id]=s.silver_stamps_required||10;});
  var pendingByMember={};pendingRows.forEach(function(p){(pendingByMember[p.member_id]=pendingByMember[p.member_id]||[]).push(p.label);});
  AMKT.loyaltyRaw=loyRows.filter(function(m){return m.active;}).map(function(m){
    return {id:m.id,name:m.name||'',phone:m.phone,restaurantId:m.restaurant_id,restaurantName:restById[m.restaurant_id]||'—',
      silverStamps:m.silver_stamps||0,silverRequired:reqById[m.restaurant_id]||10,goldLevel:m.gold_level||0,pending:pendingByMember[m.id]||[]};
  });
  var byPhone={};
  function freshCust(name,phone,email,ts){return {name:name||'',phone:phone,email:email||'',restaurants:{},orders:0,total:0,first:ts,last:ts,consent:false,loyalty:false,silver:0,gold:0,credit:0,dayCounts:[0,0,0,0,0,0,0],hourCounts:new Array(24).fill(0),itemCounts:{},history:[]};}
  rows.forEach(function(o){
    var k=o.customer_phone;if(!k)return;
    if(!byPhone[k])byPhone[k]=freshCust(o.customer_name,k,o.customer_email,o.created_at);
    var c=byPhone[k];
    c.orders++;c.total+=parseFloat(o.total)||0;
    if(o.customer_name&&!c.name)c.name=o.customer_name;
    if(o.customer_email&&!c.email)c.email=o.customer_email;
    if(o.marketing_consent)c.consent=true;
    if(restById[o.restaurant_id])c.restaurants[restById[o.restaurant_id]]=true;
    if(o.created_at>c.last)c.last=o.created_at;
    if(o.created_at<c.first)c.first=o.created_at;
    var d=new Date(o.created_at);
    if(!isNaN(d)){
      c.dayCounts[(d.getDay()+6)%7]++;
      c.hourCounts[d.getHours()]++;
    }
    var itemNames=[];
    (o.items||[]).forEach(function(it){
      var nm=it&&it.name;if(!nm)return;
      var qty=parseInt(it.qty,10)||1;
      c.itemCounts[nm]=(c.itemCounts[nm]||0)+qty;
      itemNames.push(qty>1?(qty+'× '+nm):nm);
    });
    if(c.history.length<30)c.history.push({ts:o.created_at,type:o.order_type,items:itemNames});
  });
  loyRows.forEach(function(m){
    var k=m.phone;if(!k)return;
    if(!byPhone[k])byPhone[k]=freshCust(m.name,k,m.email,m.created_at);
    var c=byPhone[k];
    if(m.name&&!c.name)c.name=m.name;
    if(m.email&&!c.email)c.email=m.email;
    if(m.marketing_consent)c.consent=true;
    if(m.active)c.loyalty=true;
    c.silver=m.silver_stamps||0;c.gold=m.gold_level||0;c.credit=parseFloat(m.credit_balance)||0;
    if(restById[m.restaurant_id])c.restaurants[restById[m.restaurant_id]]=true;
  });
  AMKT.customers=Object.keys(byPhone).map(function(k){
    var c=byPhone[k];c.restaurantList=Object.keys(c.restaurants).join(', ');
    c.history.sort(function(a,b){return new Date(b.ts)-new Date(a.ts);});
    var maxDay=-1,dayIdx=-1;c.dayCounts.forEach(function(n,i){if(n>maxDay){maxDay=n;dayIdx=i;}});
    c.preferredDay=maxDay>0?dayLabel(dayIdx):'';
    var maxHour=-1,hourIdx=-1;c.hourCounts.forEach(function(n,i){if(n>maxHour){maxHour=n;hourIdx=i;}});
    c.preferredHour=maxHour>0?(String(hourIdx).padStart(2,'0')+':00–'+String((hourIdx+1)%24).padStart(2,'0')+':00'):'';
    c.topItems=Object.keys(c.itemCounts).map(function(nm){return {name:nm,count:c.itemCounts[nm]};}).sort(function(a,b){return b.count-a.count;}).slice(0,5);
    return c;
  }).sort(function(a,b){return new Date(b.last||0)-new Date(a.last||0);});
  if(AMKT.clientiView==='tessere')renderTessereGrouped();else renderMarketingBody();
}

async function saveFedeltaConfig(restId){
  var btn=document.getElementById('fd-save');btn.disabled=true;var orig=btn.textContent;btn.textContent='Salvataggio…';
  try{
    var enabled=document.getElementById('fd-enabled').checked;
    var visAsporto=document.getElementById('fd-vis-asporto').checked;
    var visTable=document.getElementById('fd-vis-table').checked;
    var visSite=document.getElementById('fd-vis-site').checked;
    var silverReq=parseInt(document.getElementById('fd-silver-req').value,10)||10;
    var silverReward=document.getElementById('fd-silver-reward').value.trim();
    var referralReward=document.getElementById('fd-referral-reward').value.trim();
    await sbUpsert('loyalty_settings',{restaurant_id:restId,enabled:enabled,visible_asporto:visAsporto,visible_table:visTable,visible_site:visSite,silver_stamps_required:silverReq,silver_reward_label:silverReward||null,referral_reward_label:referralReward||null,updated_at:new Date().toISOString()},'restaurant_id');
    var levelRows=[],skipLevels=[];
    document.querySelectorAll('.fd-lvl-thr').forEach(function(inp){
      var lvl=parseInt(inp.getAttribute('data-lvl'),10);
      if(inp.value.trim()===''){skipLevels.push(lvl);return;}
      var rw=document.querySelector('.fd-lvl-rw[data-lvl="'+lvl+'"]');
      levelRows.push({restaurant_id:restId,level:lvl,spend_threshold:parseFloat(inp.value)||0,reward_label:(rw&&rw.value.trim())||null});
    });
    if(levelRows.length)await sbUpsert('loyalty_gold_levels',levelRows,'restaurant_id,level');
    if(skipLevels.length)await sbWrite('DELETE','loyalty_gold_levels',null,'?restaurant_id=eq.'+restId+'&level=in.('+skipLevels.join(',')+')');
    var saved=document.getElementById('fd-saved');saved.style.display='inline';setTimeout(function(){saved.style.display='none';},2000);
  }catch(e){alert('Errore nel salvataggio.');}
  btn.disabled=false;btn.textContent=orig;
}

function exportVinciteCsv(){

  ARUOTA.vincite.forEach(function(v){lines.push([v.creato_il||'',v.premio||'',v.codice||'',v.contatto||''].map(function(x){return '"'+String(x).replace(/"/g,'""')+'"';}).join(';'));});
  var blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='vincite-ruota-fkpizza.csv';document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}

  gal.querySelectorAll('[data-mdel]').forEach(function(b){
    b.onclick=async function(){
      if(!confirm('Eliminare questa foto? I piatti a cui è già assegnata la mantengono comunque.'))return;
      await mlDelete(b.getAttribute('data-mdel'));
      renderMediaGallery();
    };
  });
}
async function mediaUpload(){
  var inp=document.getElementById('mu_files'),s=document.getElementById('mu_s');
  if(!inp.files||!inp.files.length)return;
  var files=Array.prototype.slice.call(inp.files),done=0,ts=Date.now();s.textContent='Caricamento 0/'+files.length;
  for(var i=0;i<files.length;i++){try{var url=await cloudUpload(files[i],'fkpizza/media/'+ts+'_'+i);await mlSave(url,files[i].name,null);}catch(e){}done++;s.textContent='Caricamento '+done+'/'+files.length;}
  s.textContent='✓ Caricate '+done+' foto';inp.value='';
  renderMediaGallery();
}
function ensureCropper(){return new Promise(function(res,rej){if(window.Cropper)return res();var css=document.createElement('link');css.rel='stylesheet';css.href='https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css';document.head.appendChild(css);var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js';sc.onload=function(){res();};sc.onerror=function(){rej();};document.head.appendChild(sc);});}
async function openImageEditor(file,aspect,onDone,restaurantId){
  try{await ensureCropper();}catch(e){alert('Editor non disponibile (verifica la connessione).');return;}
  var url=URL.createObjectURL(file);
  var host=document.createElement('div');host.className='imged';
  host.innerHTML='<div class="imged-stage"><img id="imged-img" src="'+url+'"></div>'+
    '<div class="imged-tools">'+
    '<div class="imged-row"><span class="lbl">Zoom</span><button type="button" class="imged-tool" id="imged-zo">−</button><input type="range" id="imged-zoom" min="0" max="2" step="0.01" value="0"><button type="button" class="imged-tool" id="imged-zi">+</button></div>'+
    '<div class="imged-row"><span class="lbl">Ruota</span><button type="button" class="imged-tool" id="imged-rl">⟲</button><button type="button" class="imged-tool" id="imged-rr">⟳</button><button type="button" class="imged-tool" id="imged-rs" style="width:auto;padding:0 14px">Reset</button></div>'+
    '<div class="imged-btns"><button type="button" class="mbtn ghost" id="imged-cancel" style="margin:0">Annulla</button><button type="button" class="mbtn red" id="imged-ok" style="margin:0">Conferma</button></div>'+
    '</div>';
  document.body.appendChild(host);
  var img=host.querySelector('#imged-img');
  var cropper=new Cropper(img,{aspectRatio:aspect,viewMode:1,dragMode:'move',autoCropArea:1,background:true,responsive:true,checkOrientation:true});
  host.querySelector('#imged-zoom').oninput=function(e){cropper.zoomTo(parseFloat(e.target.value));};
  host.querySelector('#imged-zi').onclick=function(){cropper.zoom(0.1);};
  host.querySelector('#imged-zo').onclick=function(){cropper.zoom(-0.1);};
  host.querySelector('#imged-rl').onclick=function(){cropper.rotate(-90);};
  host.querySelector('#imged-rr').onclick=function(){cropper.rotate(90);};
  host.querySelector('#imged-rs').onclick=function(){cropper.reset();host.querySelector('#imged-zoom').value=0;};
  function close(){try{cropper.destroy();}catch(e){}try{URL.revokeObjectURL(url);}catch(e){}host.remove();}
  host.querySelector('#imged-cancel').onclick=close;
  host.querySelector('#imged-ok').onclick=function(){
    var ob=this;ob.textContent='...';ob.disabled=true;
    var outW=aspect>=1?1200:1080;var outH=Math.round(outW/aspect);
    var canvas=cropper.getCroppedCanvas({width:outW,height:outH,imageSmoothingQuality:'high'});
    if(!canvas){ob.textContent='Conferma';ob.disabled=false;return;}
    canvas.toBlob(function(blob){
      var f;try{f=new File([blob],'fk-edit.jpg',{type:'image/jpeg'});}catch(e){f=blob;}
      cloudUpload(f,'fkpizza/edits/'+Date.now()).then(async function(u){await mlSave(u,'foto adattata',restaurantId);close();onDone(u);}).catch(function(){ob.textContent='Conferma';ob.disabled=false;alert('Caricamento non riuscito.');});
    },'image/jpeg',0.9);
  };
}
function val(id){var e=document.getElementById(id);return e?e.value:'';}
async function up(id,folder,restaurantId){var e=document.getElementById(id);if(!e||!e.files||!e.files[0])return null;var s=document.getElementById(id+'_s');if(s)s.textContent='Caricamento…';try{var u=await cloudUpload(e.files[0],folder);await mlSave(u,e.files[0].name,restaurantId);if(s)s.textContent='✓';return u;}catch(err){if(s)s.textContent='✗ errore';return null;}}
document.addEventListener('click',function(e){
  var cp=e.target.closest&&e.target.closest('[data-cookiepref]');
  if(cp){e.preventDefault();showCookieBar();return;}
  var b=e.target.closest&&e.target.closest('[data-fklang]');if(!b)return;
  var l=b.getAttribute('data-fklang');
  LANG=l;localStorage.setItem('fkLang',l);document.documentElement.lang=l;
  if(document.getElementById('cookie-bar'))showCookieBar();
  if(document.querySelector('.fkmenu')){openWebMenu(LAST_MENU_R,LAST_MENU_DISHES,FAST.mode);return;}
  rerender();
});
function rerender(){
  clearInterval(ADMIN.ordersTimer);clearInterval(ADMIN.timerTick);
  var page=getPageType();
  document.getElementById('home-root').hidden=true;
  document.getElementById('rest-root').hidden=true;
  document.getElementById('admin-root').hidden=true;
  closeModal();CAROUSELS=[];
  if(page==='homepage')initHomepage();
  else if(page==='admin')initAdmin();
  else initRestaurant(page);
}
(function(){
  document.documentElement.lang=LANG;
  var page=getPageType();
  if(page==='homepage')initHomepage();
  else if(page==='admin')initAdmin();
  else initRestaurant(page);
  initCookieConsent();
})();
