<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>FK Pizza &amp; More</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="preconnect" href="https://llungqolufzcfaqghydt.supabase.co" crossorigin/>
<link rel="dns-prefetch" href="https://res.cloudinary.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#c0392b;--gold:#b5986a;--crown:#d4b483;--black:#0a0a0a;--cream:#f2ede6;--dark:#111;--white:#fff;--font-serif:'Playfair Display',Georgia,serif;--font-sans:'Inter',sans-serif;
--adm-bg:#ffffff;--adm-surface:#ffffff;--adm-surface2:#f2f3f5;--adm-surface3:#e8eaed;--adm-line:rgba(15,15,20,.12);--adm-line2:rgba(15,15,20,.24);--adm-text:#15171c;--adm-text-dim:#666d78;--adm-accent:#c0392b;--adm-accent2:var(--gold);--adm-accent2-text:#8a6a2f;--adm-success:#1a9850;--adm-danger:#d92d38;--adm-radius:14px}
html{scroll-behavior:smooth;overflow-x:hidden}
body{font-family:var(--font-sans);background:var(--black);color:var(--white);overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
[hidden]{display:none!important}
#loader{position:fixed;inset:0;background:var(--black);z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .6s,visibility .6s}
#loader.out{opacity:0;visibility:hidden;pointer-events:none}
.ld-logo{width:90px;height:90px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;animation:ldpulse 1s ease-in-out infinite alternate}
.ld-logo img{width:70px;height:70px;object-fit:contain}
@keyframes ldpulse{from{transform:scale(.95);opacity:.8}to{transform:scale(1.05);opacity:1}}
nav,#r-nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(10,10,10,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .3s}
nav.solid,#r-nav.solid{background:rgba(10,10,10,.95)}
.nav-logo-wrap{width:58px;height:58px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.nav-logo-wrap img{width:48px;height:48px;object-fit:contain}
.nav-tagline{font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--crown)}
.nav-burger{width:48px;height:48px;background:rgba(26,26,26,.85);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex-shrink:0}
.nav-burger span{display:block;width:22px;height:2px;background:#fff;border-radius:2px}
#drawer{position:fixed;inset:0;z-index:800;visibility:hidden;opacity:0;transition:opacity .3s,visibility .3s}
#drawer.open{visibility:visible;opacity:1}
#drawer .ov{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#drawer .panel{position:absolute;top:0;right:0;bottom:0;width:84%;max-width:340px;background:#141210;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);padding:24px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
#drawer.open .panel{transform:none}
.dw-h{font-family:var(--font-serif);color:var(--gold);font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin:18px 0 6px}
.dw-link{display:block;padding:13px 4px;font-size:16px;border-bottom:1px solid rgba(255,255,255,.07);color:#eee}
.dw-link:active{color:var(--gold)}
.dw-rest{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-size:15px}
.dw-rest small{color:rgba(255,255,255,.4);font-size:11px}
.dw-close{position:absolute;top:14px;right:16px;width:40px;height:40px;font-size:26px;color:#fff}
.langrow{display:flex;gap:8px;margin-top:6px}
.langrow button{flex:1;padding:9px;border:1px solid rgba(181,152,106,.4);border-radius:8px;font-size:12px;font-weight:600;letter-spacing:.06em}
.langrow button.on{background:var(--gold);color:var(--black);border-color:var(--gold)}
.hero{position:relative;height:100svh;min-height:600px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:var(--black)}
.hero-bg{position:absolute;inset:-4%;background-color:var(--black);background-repeat:no-repeat;background-position:center;background-size:cover;will-change:transform}
.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,5,5,.2) 0%,rgba(5,5,5,0) 38%,rgba(5,5,5,.35) 70%,rgba(5,5,5,.88) 90%,rgba(5,5,5,.98) 100%)}
.hero-body{position:relative;z-index:2;padding:0 20px 56px}
.hero-center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;text-align:center;padding-top:96px}
.hero-center .logo-badge{width:148px;height:148px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.hero-center .logo-badge img{width:78%;height:78%;object-fit:contain}
.hero-h1{font-family:var(--font-serif);font-size:clamp(44px,13vw,92px);font-weight:900;line-height:.97;letter-spacing:-.01em;text-transform:uppercase;margin-bottom:16px;text-shadow:0 2px 30px rgba(0,0,0,.7)}
.hero-h1 em{color:var(--red);font-style:normal}
.hero-sub{font-size:13px;color:rgba(255,255,255,.9);letter-spacing:.04em;margin-bottom:26px;text-shadow:0 1px 16px rgba(0,0,0,.8)}
.hero-btn{display:inline-flex;align-items:center;gap:8px;padding:15px 24px;background:var(--red);color:#fff;border-radius:14px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 4px 16px rgba(192,57,43,.3)}
.hero-scroll{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:2;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45)}
#r-hero-bg{inset:0}
#r-bottombar{position:fixed;bottom:0;left:0;right:0;z-index:700;display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(10,10,10,.9);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.08)}
#r-bottombar a{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:14px 8px;border-radius:12px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#fff}
#r-bottombar a svg{width:17px;height:17px}
#r-bottombar a.call{background:#1f1f1f}#r-bottombar a.book{background:var(--red)}#r-bottombar a.wa{background:#1f8f4e}
.has-bottombar{padding-bottom:84px}
.logo-sec{background:var(--black);display:flex;flex-direction:column;align-items:center;padding:60px 20px}
.logo-big{width:180px;height:180px;background:#fff;border-radius:24px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;overflow:hidden}
.logo-big img{width:80%;height:80%;object-fit:contain}
.logo-sub{font-size:11px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--crown);display:flex;align-items:center;gap:10px}
.logo-sub em{font-style:normal;font-size:7px;opacity:.5}
.sec{padding:60px 0}
.sec-cream{background:var(--cream);color:var(--black)}
.sec-dark{background:var(--black);color:var(--white)}
.sec-hd{text-align:center;padding:0 20px;margin-bottom:32px}
.sec-tag{font-size:10px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:10px}
.sec-title{font-family:var(--font-serif);font-size:clamp(30px,8vw,58px);font-weight:700;line-height:1.05}
.sec-title em{color:var(--red);font-style:normal}
.sec-rule{width:46px;height:2px;background:var(--red);margin:14px auto 0}
.cat-title{font-family:var(--font-serif);font-size:clamp(24px,6vw,38px);font-weight:700;text-align:center;margin:6px 0 4px}
.cat-rule{width:40px;height:2px;background:var(--gold);margin:0 auto 22px}
.sec-cream .cat-title{color:var(--black)}
.rv{opacity:0;transform:translateY(30px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
.car-scroll{overflow:hidden}
.car-track{display:flex;position:relative;transition:transform .45s cubic-bezier(.4,0,.2,1);will-change:transform}
.car-nav{display:flex;gap:12px;justify-content:center;margin-top:22px}
.car-btn{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0;touch-action:manipulation}
.car-btn:active{transform:scale(.9)}
.car-btn svg{width:14px;height:14px}
.car-btn-dark{border:1.5px solid rgba(0,0,0,.2);background:#fff;color:#222}
.car-btn-dark:active{background:var(--red);border-color:var(--red);color:#fff}
.car-btn-light{border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#fff}
.car-btn-light:active{background:var(--red);border-color:var(--red);color:#fff}
.rest-slide{flex:0 0 100%;padding:0 20px}
.rest-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.rest-img{aspect-ratio:16/9;background:#111;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.rest-img img.logo-in{width:96px;height:96px;object-fit:contain;border-radius:12px}
.rest-img img.hero-in{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.rest-info{padding:22px}
.rest-name{font-family:var(--font-serif);font-size:26px;font-weight:700;color:var(--black);margin-bottom:6px}
.rest-addr{font-size:12px;color:rgba(0,0,0,.45);margin-bottom:18px}
.rest-cta{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--red);border-bottom:1px solid var(--red);padding-bottom:2px;display:inline-flex;gap:6px}
.dish-slide{flex:0 0 80%;padding:0 8px}
.dish-slide:first-child{padding-left:20px}.dish-slide:last-child{padding-right:20px}
.dish-card{border-radius:16px;overflow:hidden;position:relative;aspect-ratio:.82;background:#1a1a1a}
.dish-ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dish-ph-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#2a2622,#141210)}
.dish-ph-empty svg{width:54px;height:54px;opacity:.4;color:var(--gold)}
.dish-card-body{position:absolute;bottom:0;left:0;right:0;padding:18px 18px 16px;background:linear-gradient(to top,rgba(0,0,0,.92) 12%,rgba(0,0,0,.45) 60%,transparent 100%)}
.dish-card-name{font-family:var(--font-serif);font-size:21px;font-weight:700;color:#fff;margin-bottom:4px;line-height:1.1}
.dish-card-desc{font-size:12px;color:rgba(255,255,255,.72);line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dish-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dish-card-price{font-size:16px;font-weight:600;color:var(--gold)}
.alg-row{display:flex;gap:4px;flex-wrap:wrap}
.alg-chip{font-size:13px;line-height:1;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12)}
.rev-slide{flex:0 0 88%;padding:0 8px}
.rev-slide:first-child{padding-left:20px}.rev-slide:last-child{padding-right:20px}
.rev-card{background:#1a1a1a;border-radius:16px;padding:24px;border:1px solid rgba(255,255,255,.06)}
.rev-verified{font-size:11px;color:rgba(255,255,255,.35);margin-bottom:10px}
.rev-verified em{color:#4ade80;font-style:normal;font-weight:600}
.rev-stars{color:#f59e0b;font-size:18px;letter-spacing:2px;margin-bottom:14px}
.rev-text{font-size:14px;line-height:1.7;color:rgba(255,255,255,.82);margin-bottom:16px}
.rev-author{font-size:12px;color:rgba(255,255,255,.35)}
.insta-slide{flex:0 0 46%;padding:0 5px}
.insta-slide:first-child{padding-left:20px}.insta-slide:last-child{padding-right:20px}
.insta-card{border-radius:12px;overflow:hidden;aspect-ratio:1;position:relative;background:#1a1a1a;display:block}
.insta-card img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.insta-handle-label{position:absolute;bottom:10px;left:12px;font-size:12px;font-weight:500;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.insta-note{max-width:560px;margin:18px auto 0;padding:0 20px;font-size:14px;line-height:1.7;color:rgba(255,255,255,.82);text-align:center;white-space:pre-wrap}
.r-where{background:var(--cream);color:var(--black);padding:60px 0}
.r-map{max-width:760px;margin:0 auto 26px;padding:0 20px}
.r-map-frame{border-radius:16px;overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.12);aspect-ratio:16/10;border:0;width:100%}
.r-meta{max-width:620px;margin:0 auto;padding:0 24px;display:grid;gap:22px}
.r-meta h4{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.r-meta p,.r-meta li{font-size:14px;line-height:1.7;color:#333}
.r-hours{list-style:none;display:grid;gap:6px}
.r-hours li{display:flex;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,.07);padding-bottom:6px}
.r-hours li.closed span:last-child{color:var(--red);font-weight:600}
.r-hours li.today{font-weight:700}
.tool-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px;padding:0 20px}
.tool-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:12px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--black);color:#fff}
.tool-btn.gold{background:var(--gold);color:var(--black)}
.tool-btn.red{background:var(--red);color:#fff}
footer{background:var(--black);border-top:1px solid rgba(255,255,255,.06);padding:30px 20px;text-align:center}
.ft-copy{font-size:11px;color:rgba(255,255,255,.3);line-height:2}
.ft-copy a{color:rgba(255,255,255,.45);border-bottom:1px solid rgba(255,255,255,.15)}
.modal{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .ov{position:absolute;inset:0;background:rgba(6,6,8,.82)}
.modal-box{position:relative;width:100%;max-width:440px;max-height:86vh;overflow-y:auto;background:#161310;border:1px solid rgba(181,152,106,.3);border-radius:18px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.5);color:#fff}
.modal-box h3{font-family:var(--font-serif);color:var(--gold);font-size:22px;margin-bottom:18px;text-align:center}
.modal-x{position:absolute;top:12px;right:14px;width:36px;height:36px;border-radius:10px;font-size:20px;color:rgba(255,255,255,.6);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center}
.modal-x:active{background:rgba(255,255,255,.14);color:#fff}
.modal.admin-modal{color-scheme:light}
.modal.admin-modal .modal-box{background:var(--adm-surface);border-color:var(--adm-line2);color:var(--adm-text)}
.modal.admin-modal .modal-box h3{color:var(--adm-accent2-text)}
.modal.admin-modal .modal-x{color:var(--adm-text-dim);background:rgba(15,15,20,.06)}
.modal.admin-modal .modal-x:active{background:rgba(15,15,20,.1);color:var(--adm-text)}
.alg-legend{display:grid;gap:8px}
.alg-legend div{display:flex;align-items:center;gap:12px;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.alg-legend .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);font-size:16px;flex-shrink:0}
.legend-overlay{position:fixed;inset:0;z-index:950;display:flex;align-items:center;justify-content:center;padding:20px}
.legend-overlay .ov{position:absolute;inset:0;background:rgba(6,6,8,.82)}
.legend-overlay-box{position:relative;width:100%;max-width:440px;max-height:86vh;overflow-y:auto;background:#161310;border:1px solid rgba(181,152,106,.3);border-radius:18px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.5);color:#fff}
.legend-overlay-box h3{font-family:var(--font-serif);color:var(--gold);font-size:22px;margin-bottom:18px;text-align:center}
.legend-overlay-x{position:absolute;top:12px;right:14px;width:36px;height:36px;border-radius:10px;font-size:20px;color:rgba(255,255,255,.6);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center}
.qr-img{width:240px;height:240px;margin:0 auto;background:#fff;border-radius:12px;padding:10px}
.qr-link{font-size:12px;text-align:center;color:var(--adm-accent2-text);word-break:break-all;margin-top:14px}
.mbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:11px;font-size:13.5px;font-weight:600;letter-spacing:.03em;margin-top:10px;transition:filter .15s,background .15s,border-color .15s}
.mbtn.red{background:var(--adm-accent);color:#fff}.mbtn.red:active{filter:brightness(.88)}
.mbtn.green{background:var(--adm-success);color:#08130b}.mbtn.green:active{filter:brightness(.9)}
.mbtn.gold{background:var(--adm-accent2);color:#1a1305}.mbtn.gold:active{filter:brightness(.92)}
.mbtn.ghost{border:1px solid var(--adm-line2);color:var(--adm-text);background:var(--adm-surface2)}.mbtn.ghost:active{background:var(--adm-surface3)}
.mbtn:disabled{opacity:.5;pointer-events:none}
.home-langs button.on{background:var(--gold);color:var(--black);border-color:var(--gold)}
.ferie-banner{background:linear-gradient(90deg,var(--red),#a5281b);color:#fff;text-align:center;padding:13px 16px;font-size:13px;font-weight:600;letter-spacing:.02em;border-radius:12px;margin:0 20px 22px}
.pmenu{position:fixed;inset:0;z-index:950;background:var(--cream);color:#1a1a1a;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pmenu-inner{max-width:760px;margin:0 auto;padding:18px 20px 120px}
.pmenu-head{text-align:center;margin-bottom:14px;padding-bottom:18px;border-bottom:2px solid var(--red)}
.pmenu-head .pm-logo{width:96px;height:96px;background:#fff;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 4px 18px rgba(0,0,0,.12);overflow:hidden}
.pmenu-head .pm-logo img{width:78%;height:78%;object-fit:contain}
.pmenu-head h2{font-family:var(--font-serif);font-size:30px;color:#111}
.pmenu-head p{font-size:12px;color:#666;margin-top:4px}
.pm-cat{margin-top:24px}
.pm-cat h3{font-family:var(--font-serif);font-size:21px;color:var(--red);border-bottom:1px solid rgba(0,0,0,.12);padding-bottom:6px;margin-bottom:10px}
.pm-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dotted rgba(0,0,0,.14)}
.pm-item>input{width:20px;height:20px;margin-top:2px;flex-shrink:0;accent-color:var(--red)}
.pm-item .pm-body{flex:1;min-width:0}
.pm-item .pm-name{font-weight:600;font-size:15px;color:#111}
.pm-item .pm-desc{font-size:12px;color:#777;line-height:1.4}
.pm-item .pm-alg{font-size:13px;margin-top:2px}
.pm-item .pm-price{font-weight:700;color:#111;white-space:nowrap;font-size:15px}
.pmenu-actions{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:rgba(20,18,16,.96);backdrop-filter:blur(12px);z-index:960}
.pmenu-actions button{flex:1;padding:14px 8px;border-radius:12px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.pmenu-actions .pm-wa{background:#1f8f4e}.pmenu-actions .pm-print{background:var(--red)}.pmenu-actions .pm-close{background:#333}
@media print{body{background:#fff!important}#loader,nav,#r-nav,#drawer,#r-bottombar,footer,#home-root,#rest-root,#admin-root,.pmenu-actions,.pm-item input,.fk-step,.fk-fastpanel,.fkmenu-top,.fk-langbar{display:none!important}.pmenu{position:static!important;background:#fff!important;color:#000!important}.pmenu-inner{padding:0;max-width:100%}}

function fkStore(){return localStorage.getItem('fkRemember')==='0'?sessionStorage:localStorage;}
function getJwt(){return fkStore().getItem('fkJwt')||SB.KEY;}
function getRefreshTok(){return fkStore().getItem('fkJwtR')||'';}
function setAuthSession(access,refresh,remember){
  var keep=remember!==false;
  localStorage.setItem('fkRemember',keep?'1':'0');
  var store=keep?localStorage:sessionStorage;
  var other=keep?sessionStorage:localStorage;
  other.removeItem('fkJwt');other.removeItem('fkJwtR');other.removeItem('adminAuth');
  store.setItem('fkJwt',access);
  if(refresh)store.setItem('fkJwtR',refresh);
}
function clearAuthSession(){['fkJwt','fkJwtR','adminAuth'].forEach(function(k){localStorage.removeItem(k);sessionStorage.removeItem(k);});localStorage.removeItem('fkRemember');}
function jwtExpMs(tok){try{var part=tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');while(part.length%4)part+='=';var p=JSON.parse(atob(part));return (p.exp||0)*1000;}catch(e){return 0;}}
var FK_REFRESHING=null;
async function refreshAuthSession(){
  if(FK_REFRESHING)return FK_REFRESHING;
  FK_REFRESHING=(async function(){
    var rt=getRefreshTok();if(!rt)throw new Error('no refresh token');
    var res=await fetch(SB.URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB.KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});
    if(!res.ok)throw new Error('refresh failed');
    var d=await res.json();
    setAuthSession(d.access_token,d.refresh_token,localStorage.getItem('fkRemember')!=='0');
    return d.access_token;
  })();
  try{return await FK_REFRESHING;}finally{FK_REFRESHING=null;}
}
async function ensureFreshSession(){
  var tok=fkStore().getItem('fkJwt');if(!tok)return;
  var exp=jwtExpMs(tok);
  if(exp&&exp-Date.now()<5*60*1000){try{await refreshAuthSession();}catch(e){clearAuthSession();}}
}
function cacheGet(k,maxAgeMs){try{var r=JSON.parse(sessionStorage.getItem('fkc_'+k));if(!r)return null;if(maxAgeMs&&Date.now()-r.t>maxAgeMs)return null;return r.v;}catch(e){return null;}}
function cacheSet(k,v){try{sessionStorage.setItem('fkc_'+k,JSON.stringify({t:Date.now(),v:v}));}catch(e){}}

  host.style.cssText='position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:rgba(6,6,8,.75);padding:16px;color-scheme:light';

    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px"><h3 style="margin:0;font-family:var(--font-serif);color:var(--adm-accent2-text)">Scegli una foto</h3><button type="button" id="mlp-close" style="width:36px;height:36px;border-radius:10px;font-size:20px;color:var(--adm-text-dim);background:var(--adm-surface2)">&times;</button></div>'+
    '<label class="mbtn gold" style="width:auto;padding:10px 16px;margin:0 0 10px;display:inline-flex;cursor:pointer">+ Carica nuove foto<input type="file" id="mlp-upload" accept="image/*" multiple hidden></label>'+
    '<div id="mlp-status" class="uploading"></div>'+
    '<div id="mlp-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;overflow-y:auto;flex:1"><p class="muted">Caricamento…</p></div>'+
    '</div>';
  document.body.appendChild(host);
  host.onclick=function(){closeMediaPicker();};
  document.getElementById('mlp-close').onclick=closeMediaPicker;
  async function refresh(){
    var items=await mlList();
    var grid=document.getElementById('mlp-grid');if(!grid)return;
    if(!items.length){grid.innerHTML='<p class="muted">Nessuna foto ancora caricata. Usa "Carica nuove foto" qui sopra.</p>';return;}
    grid.innerHTML=items.map(function(m){return '<img data-url="'+esc(m.url)+'" src="'+cdnThumb(m.url,160)+'" loading="lazy" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;background:var(--adm-surface2);border:1px solid var(--adm-line)">';}).join('');
    grid.querySelectorAll('img').forEach(function(im){im.onclick=function(){var u=im.getAttribute('data-url');closeMediaPicker();onPick(u);};});
  }
  document.getElementById('mlp-upload').onchange=async function(){
    var files=Array.prototype.slice.call(this.files);if(!files.length)return;
    var s=document.getElementById('mlp-status');var done=0;s.textContent='Caricamento 0/'+files.length;
    var ts=Date.now();

      try{var url=await cloudUpload(files[i],'fkpizza/media/'+ts+'_'+i);await mlSave(url,files[i].name,opts.restaurantId);}catch(e){}
      done++;s.textContent='Caricamento '+done+'/'+files.length;
    }
    s.textContent='✓ Caricate '+done+' foto';this.value='';refresh();
  };
  refresh();
}

var CAROUSELS=[];
function attachCarousel(scrollId,prevId,nextId,autoMs,refill){var sc=document.getElementById(scrollId);if(!sc)return;var index=0,timer=null;
function tk(){return sc.querySelector('.car-track');}
function count(){var t=tk();return t?t.children.length:0;}
function apply(){var t=tk();if(!t||!t.children.length)return;var n=t.children.length;if(index>=n)index=0;if(index<0)index=n-1;var x=0;for(var i=0;i<index;i++)x+=t.children[i].getBoundingClientRect().width;t.style.transform='translateX('+(-x)+'px)';}
function go(d){var n=count();if(n<1)return;index=index+d;if(index>=n){index=0;if(refill){refill();}}else if(index<0){index=n-1;}apply();}
function start(){stop();if(!autoMs||count()<2)return;timer=setInterval(function(){if(!document.hidden)go(1);},autoMs);}
function stop(){if(timer){clearInterval(timer);timer=null;}}
function bump(){stop();start();}
var prev=document.getElementById(prevId),next=document.getElementById(nextId);
if(prev)prev.onclick=function(e){e.preventDefault();go(-1);bump();};
if(next)next.onclick=function(e){e.preventDefault();go(1);bump();};
var x0=null,y0=null;
sc.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;stop();},{passive:true});
sc.addEventListener('touchend',function(e){if(x0!==null){var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))go(dx<0?1:-1);}x0=null;y0=null;start();},{passive:true});
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(apply,150);});
CAROUSELS.push({apply:apply,start:start});}
function startAllCarousels(){CAROUSELS.forEach(function(c){c.apply();c.start();});}
document.addEventListener('visibilitychange',function(){if(!document.hidden)startAllCarousels();});

async function submitFastOrder(R){
  var items=[];Object.keys(FAST.cart).forEach(function(k){var c=FAST.cart[k];if(c.qty>0)items.push({name:c.name,qty:c.qty,price:c.price,note:(FAST.notes&&FAST.notes[k])||''});});
  if(!items.length){alert(t('needitems'));return;}
  var isAsporto=FAST.mode==='asporto';
  var body={restaurant_id:R.id,order_type:FAST.mode,items:items,total:fastTotal(),source:'customer',status:'new'};
  if(isAsporto){
    if(!FAST.phone){alert(t('needphone'));return;}
    if(!FAST.name){alert(t('needname'));return;}
    if(!FAST.deliveryTime){alert(t('needtime'));return;}
    body.customer_phone=FAST.phone;body.customer_name=FAST.name;body.delivery_time=FAST.deliveryTime;
  }else{
    if(!FAST.table){alert(t('needtable'));return;}
    if(!fastAllowed(R)){alert(t('fastexpired'));return;}
    body.table_number=FAST.table;body.people=parseInt(FAST.people,10)||null;
  }
  var send=document.getElementById('fk-send');if(send){send.disabled=true;send.textContent='...';}
  try{
    if(!isAsporto){
      var busy=false;try{busy=await sbRpc('fk_table_has_active_order',{p_restaurant:R.id,p_table:FAST.table});}catch(e){}
      if(busy){if(send){send.disabled=false;send.textContent=t('sendorder');}alert(LANG==='it'?('Per il tavolo '+FAST.table+' c\u2019\u00e8 gia un ordine in corso. Chiedi al personale per aggiungere altro.'):'This table already has an order in progress. Please ask the staff to add more.');return;}
    }
    await orderInsert(body);
    closeModal();toast(t('ordersent'));
  }catch(e){if(send){send.disabled=false;send.textContent=t('sendorder');}alert('Errore invio ordine. Riprova.');}
}

function sendPhysicalWa(R,host){
  var picked=[];host.querySelectorAll('.pm-item input:checked').forEach(function(i){picked.push('• '+i.getAttribute('data-name')+' '+i.getAttribute('data-price'));});

async function sbStorageUpload(bucket,path,blob,contentType){
  var res=await fetch(SB.URL+'/storage/v1/object/'+bucket+'/'+path,{method:'POST',headers:{apikey:SB.KEY,Authorization:'Bearer '+getJwt(),'Content-Type':contentType||'application/octet-stream','x-upsert':'true'},body:blob});
  if(!res.ok)throw new Error('storage upload '+res.status);
  return true;
}
async function sbStorageSignedUrl(bucket,path,expiresIn){
  var res=await fetch(SB.URL+'/storage/v1/object/sign/'+bucket+'/'+path,{method:'POST',headers:{apikey:SB.KEY,Authorization:'Bearer '+getJwt(),'Content-Type':'application/json'},body:JSON.stringify({expiresIn:expiresIn||3600})});
  if(!res.ok)throw new Error('sign '+res.status);
  var d=await res.json();
  return SB.URL+'/storage/v1'+d.signedURL;
}
function fmtQty(n){n=parseFloat(n)||0;return (Math.round(n*100)/100).toString().replace('.',',');}
function fmtDateIt(s){try{var d=new Date(s);return d.toLocaleDateString('it',{day:'2-digit',month:'2-digit',year:'numeric'});}catch(e){return s;}}
function mondayOf(d){d=new Date(d);var day=d.getDay();var diff=(day===0?-6:1-day);var m=new Date(d);m.setDate(d.getDate()+diff);m.setHours(0,0,0,0);return m;}
function isoDate(d){return d.toISOString().slice(0,10);}
function ensureZXing(){return new Promise(function(res,rej){if(window.ZXing)return res();var sc=document.createElement('script');sc.src='https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js';sc.onload=function(){res();};sc.onerror=function(){rej();};document.head.appendChild(sc);});}
function ensureJsPDF(){return new Promise(function(res,rej){if(window.jspdf)return res();var sc=document.createElement('script');sc.src='https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js';sc.onload=function(){res();};sc.onerror=function(){rej();};document.head.appendChild(sc);});}
async function openBarcodeScanner(onDetect){
  var host=document.createElement('div');host.id='bcs-host';
  host.style.cssText='position:fixed;inset:0;z-index:2100;background:#000;display:flex;flex-direction:column;color-scheme:light';
  host.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--adm-surface)"><h3 style="margin:0;color:var(--adm-accent2-text);font-family:var(--font-serif);font-size:18px">Scansiona codice a barre</h3><button type="button" id="bcs-close" style="width:36px;height:36px;border-radius:10px;background:var(--adm-surface2);color:var(--adm-text);font-size:20px;flex-shrink:0">&times;</button></div>'+
    '<div style="flex:1;position:relative;overflow:hidden;min-height:200px;background:#000"><video id="bcs-video" playsinline autoplay muted style="width:100%;height:100%;object-fit:cover"></video><div style="position:absolute;inset:15% 8%;border:3px solid var(--adm-accent2);border-radius:14px;pointer-events:none"></div></div>'+
    '<div style="padding:14px 16px;background:var(--adm-surface)"><p class="muted" id="bcs-status" style="text-align:center">Inquadra il codice a barre del prodotto</p><div class="field" style="margin-top:10px;margin-bottom:0"><input id="bcs-manual" placeholder="oppure digita il codice qui"></div><button class="mbtn gold" id="bcs-manual-go" style="max-width:280px;margin:8px auto 0">Usa codice digitato</button></div>';
  document.body.appendChild(host);
  var stream=null,stopped=false,zxingReader=null;
  function cleanup(){stopped=true;if(stream)stream.getTracks().forEach(function(t){t.stop();});if(zxingReader){try{zxingReader.reset();}catch(e){}}host.remove();}
  document.getElementById('bcs-close').onclick=cleanup;
  document.getElementById('bcs-manual-go').onclick=function(){var v=document.getElementById('bcs-manual').value.trim();if(v){cleanup();onDetect(v);}};
  var video=document.getElementById('bcs-video');
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});}
  catch(e){var st=document.getElementById('bcs-status');if(st)st.textContent='Fotocamera non disponibile. Digita il codice manualmente.';return;}
  video.srcObject=stream;
  try{await video.play();}catch(e){}
  if('BarcodeDetector' in window){
    try{
      var formats=await window.BarcodeDetector.getSupportedFormats();
      var detector=new window.BarcodeDetector({formats:formats});
      var loop=async function(){
        if(stopped)return;
        try{var codes=await detector.detect(video);if(codes&&codes.length){cleanup();onDetect(codes[0].rawValue);return;}}catch(e){}
        requestAnimationFrame(loop);
      };
      loop();return;
    }catch(e){}
  }
  try{
    await ensureZXing();
    zxingReader=new ZXing.BrowserMultiFormatReader();
    zxingReader.decodeFromVideoElement(video,function(result){if(stopped)return;if(result){var text=result.getText();cleanup();onDetect(text);}});
  }catch(e){var st2=document.getElementById('bcs-status');if(st2)st2.textContent='Scanner non disponibile su questo dispositivo. Digita il codice manualmente.';}
}
function adminMagazzino(p){
  var list=myRestaurants();
  if(!list.length){p.innerHTML='<div class="panel-head"><h2>Magazzino</h2></div><p class="muted">Nessun ristorante assegnato.</p>';return;}
  if(!AMAG.rest||!list.some(function(r){return r.id===AMAG.rest;}))AMAG.rest=list[0].id;
  var opts=list.map(function(r){return '<option value="'+esc(r.id)+'"'+(r.id===AMAG.rest?' selected':'')+'>'+esc(r.name)+'</option>';}).join('');
  var subtabs=[['prodotti','Prodotti'],['movimenti','Carico / Scarico'],['fornitori','Fornitori'],['ordini','Ordini'],['report','Report']];
  var subHtml=subtabs.map(function(s){return '<button data-mt="'+s[0]+'" class="'+(AMAG.tab===s[0]?'on':'')+'">'+s[1]+'</button>';}).join('');
  p.innerHTML='<div class="panel-head"><h2>Magazzino</h2></div>'+
    (list.length>1?'<div class="field" style="max-width:360px"><label>Ristorante</label><select id="mg-rest">'+opts+'</select></div>':'')+
    '<p class="muted" style="margin-bottom:10px">Ogni ristorante ha il proprio magazzino, separato dagli altri.</p>'+
    '<div class="wt-pickcat" id="mg-subtabs">'+subHtml+'</div>'+
    '<div id="mg-body"><p class="muted">Caricamento…</p></div>';
  var rsel=document.getElementById('mg-rest');
  if(rsel)rsel.onchange=function(e){AMAG.rest=e.target.value;loadMagData().then(function(){checkAllLowStock();renderMagBody();});};
  document.querySelectorAll('#mg-subtabs [data-mt]').forEach(function(b){b.onclick=function(){AMAG.tab=b.getAttribute('data-mt');document.querySelectorAll('#mg-subtabs [data-mt]').forEach(function(x){x.classList.remove('on');});b.classList.add('on');renderMagBody();};});
  loadMagData().then(function(){checkAllLowStock();renderMagBody();});
}
async function loadMagData(){
  try{AMAG.suppliers=await sbAuthFetch('suppliers','?restaurant_id=eq.'+AMAG.rest+'&order=name');}catch(e){AMAG.suppliers=[];}
  try{AMAG.products=await sbAuthFetch('warehouse_products','?restaurant_id=eq.'+AMAG.rest+'&order=name');}catch(e){AMAG.products=[];}
}
function renderMagBody(){
  var box=document.getElementById('mg-body');if(!box)return;
  if(AMAG.tab==='prodotti')return magProdotti(box);
  if(AMAG.tab==='movimenti')return magMovimenti(box);
  if(AMAG.tab==='fornitori')return magFornitori(box);
  if(AMAG.tab==='ordini')return magOrdini(box);
  if(AMAG.tab==='report')return magReport(box);
}
async function checkAllLowStock(){
  var low=AMAG.products.filter(function(pr){return parseFloat(pr.stock)<=parseFloat(pr.min_stock);});
  if(!low.length)return;
  var existing=[];try{existing=await sbAuthFetch('warehouse_orders','?restaurant_id=eq.'+AMAG.rest+'&status=eq.pending&auto=eq.true&select=product_id');}catch(e){existing=[];}
  var haveOrder={};existing.forEach(function(o){haveOrder[o.product_id]=true;});
  var toCreate=low.filter(function(pr){return !haveOrder[pr.id];});
  for(var i=0;i<toCreate.length;i++){
    var pr=toCreate[i];
    try{await sbWrite('POST','warehouse_orders',{restaurant_id:AMAG.rest,product_id:pr.id,product_name:pr.name,supplier_id:pr.supplier_id||null,qty:Math.max(1,parseFloat(pr.min_stock)||1),status:'pending',auto:true,note:'Generato automaticamente: scorta minima raggiunta'});}catch(e){}
  }
}

/* ----- Carico / Scarico ----- */
function magMovimenti(box){
  var prodOpts=AMAG.products.map(function(pr){return '<option value="'+esc(pr.id)+'">'+esc(pr.name)+' ('+fmtQty(pr.stock)+' '+esc(pr.unit)+')</option>';}).join('');
  box.innerHTML='<div class="panel-head" style="margin-top:14px"><h2 style="font-size:16px">Carico / Scarico</h2></div>'+
    '<button class="mbtn gold" id="m-scan" style="max-width:320px">📷 Scansiona codice a barre</button>'+
    '<div class="adsub">Movimento manuale</div>'+
    '<div class="field"><label>Prodotto</label><select id="m_prod">'+(prodOpts||'<option value="">Nessun prodotto in magazzino</option>')+'</select></div>'+
    '<div class="colorgrid">'+
      '<div class="field"><label>Tipo</label><select id="m_type"><option value="in">Carico (+)</option><option value="out">Scarico (−)</option></select></div>'+
      '<div class="field"><label>Quantità</label><input id="m_qty" type="number" step="0.01" min="0.01" value="1"></div>'+
    '</div>'+
    '<div class="field"><label>Nota (facoltativa)</label><input id="m_note"></div>'+
    (prodOpts?'<button class="mbtn red" id="m_save">Registra movimento</button>':'')+
    '<div class="adsub">Ultimi movimenti</div><div id="m-list"><p class="muted">Caricamento…</p></div>';
  document.getElementById('m-scan').onclick=function(){
    openBarcodeScanner(function(code){
      var pr=AMAG.products.find(function(x){return x.barcode===code;});
      if(!pr){alert('Nessun prodotto con questo codice a barre. Aggiungilo prima dalla sezione Prodotti.');return;}
      openQuickMovement(pr);
    });
  };
  var saveBtn=document.getElementById('m_save');
  if(saveBtn)saveBtn.onclick=async function(){
    var pid=val('m_prod'),type=document.getElementById('m_type').value,qty=parseFloat(val('m_qty'))||0;
    if(!pid||qty<=0){alert('Seleziona un prodotto e una quantità valida.');return;}
    this.textContent='...';
    try{await registerMovement(pid,type,qty,val('m_note'),'manual');this.textContent='Registra movimento';renderMagBody();toast('Movimento registrato');}
    catch(e){this.textContent='Registra movimento';alert('Registrazione non riuscita.');}
  };
  loadMagMovements();
}
async function loadMagMovements(){
  var box=document.getElementById('m-list');if(!box)return;
  var rows=[];try{rows=await sbAuthFetch('warehouse_movements','?restaurant_id=eq.'+AMAG.rest+'&order=created_at.desc&limit=30');}catch(e){}
  if(!rows.length){box.innerHTML='<p class="muted">Nessun movimento registrato.</p>';return;}
  box.innerHTML=rows.map(function(m){
    var pr=AMAG.products.find(function(x){return x.id===m.product_id;});
    var tm='';try{tm=new Date(m.created_at).toLocaleString('it',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){}
    var sign=m.type==='in'?'+':'−';
    var color=m.type==='in'?'var(--adm-success)':'var(--adm-danger)';
    return '<div class="wt-dish"><span class="nm">'+esc(pr?pr.name:'Prodotto rimosso')+(m.note?' · '+esc(m.note):'')+'<br><small style="opacity:.6">'+tm+(m.source==='barcode'?' · 📷':'')+'</small></span><span style="color:'+color+';font-weight:700">'+sign+fmtQty(m.qty)+'</span></div>';
  }).join('');
}
async function registerMovement(productId,type,qty,note,source){
  await sbWrite('POST','warehouse_movements',{restaurant_id:AMAG.rest,product_id:productId,type:type,qty:qty,note:note||null,source:source||'manual'});
  var pr=AMAG.products.find(function(x){return x.id===productId;});
  if(pr){
    var delta=type==='in'?qty:-qty;
    var newStock=Math.max(0,(parseFloat(pr.stock)||0)+delta);
    await sbWrite('PATCH','warehouse_products',{stock:newStock},'?id=eq.'+productId);
    pr.stock=newStock;
  }
  await checkAllLowStock();
}
function openQuickMovement(pr){
  openModal('<h3>'+esc(pr.name)+'</h3><p class="muted" style="margin-bottom:14px">Giacenza attuale: '+fmtQty(pr.stock)+' '+esc(pr.unit)+'</p>'+
    '<div class="colorgrid">'+
      '<div class="field"><label>Tipo</label><select id="qm_type"><option value="in">Carico (+)</option><option value="out">Scarico (−)</option></select></div>'+
      '<div class="field"><label>Quantità</label><input id="qm_qty" type="number" step="0.01" min="0.01" value="1"></div>'+
    '</div>'+
    '<button class="mbtn red" id="qm_save">Registra</button>');
  document.getElementById('qm_save').onclick=async function(){
    var type=document.getElementById('qm_type').value,qty=parseFloat(val('qm_qty'))||0;
    if(qty<=0){alert('Quantità non valida.');return;}
    this.textContent='...';
    try{await registerMovement(pr.id,type,qty,null,'barcode');closeModal();renderMagBody();toast('Movimento registrato');}
    catch(e){this.textContent='Registra';alert('Registrazione non riuscita.');}
  };
}
/* ----- Ordini ----- */
function orderRow(o){
  var supplier=AMAG.suppliers.find(function(s){return s.id===o.supplier_id;});
  var statusLbl={pending:'Da ordinare',ordered:'Ordinato',received:'Ricevuto'}[o.status]||o.status;
  var acts='';
  if(o.status==='pending')acts+='<button class="mbtn gold" style="width:auto;padding:8px 12px;margin:0" data-oord="'+esc(o.id)+'">Segna ordinato</button>';
  if(o.status!=='received')acts+='<button class="mbtn green" style="width:auto;padding:8px 12px;margin:0" data-orecv="'+esc(o.id)+'">Ricevuto</button>';
  acts+='<button class="mbtn ghost" style="width:auto;padding:8px 12px;margin:0" data-odel="'+esc(o.id)+'">🗑</button>';
  return '<div class="adrow"><div class="info"><h4>'+esc(o.product_name)+(o.auto?' <small style="color:var(--adm-danger)">(scorta minima)</small>':'')+'</h4><p>'+fmtQty(o.qty)+(supplier?' · '+esc(supplier.name):'')+' · '+statusLbl+(o.note?' · '+esc(o.note):'')+'</p></div><div class="adrow-act">'+acts+'</div></div>';
}
function magOrdini(box){

/* ----- Report PDF settimanale ----- */
async function buildWarehousePdfBlob(restaurant,products,supById,weekStartStr){
  await ensureJsPDF();
  var doc=new window.jspdf.jsPDF();
  doc.setFontSize(16);doc.text('Report Giacenza Magazzino',14,18);
  doc.setFontSize(11);doc.text(restaurant.name||'',14,26);
  doc.text('Settimana dal '+fmtDateIt(weekStartStr),14,32);
  var y=44;
  doc.setFontSize(9);
  doc.text('Prodotto',14,y);doc.text('Fornitore',90,y);doc.text('Giacenza',140,y);doc.text('Scorta min.',170,y);
  y+=4;doc.line(14,y,196,y);y+=6;
  products.forEach(function(pr){
    if(y>280){doc.addPage();y=20;}
    var low=parseFloat(pr.stock)<=parseFloat(pr.min_stock);
    doc.setTextColor(low?200:20,low?40:20,low?40:20);
    doc.text(String(pr.name||'').slice(0,38),14,y);
    doc.text(String(supById[pr.supplier_id]||'').slice(0,22),90,y);
    doc.text(fmtQty(pr.stock)+' '+(pr.unit||''),140,y);
    doc.text(fmtQty(pr.min_stock),170,y);
    y+=6;
  });
  doc.setTextColor(20,20,20);
  return doc.output('blob');
}
async function generateAndSaveReport(restaurant,weekStart){
  var supById={};AMAG.suppliers.forEach(function(s){supById[s.id]=s.name;});
  var blob;
  try{blob=await buildWarehousePdfBlob(restaurant,AMAG.products,supById,weekStart);}catch(e){return null;}
  var path=AMAG.rest+'/'+weekStart+'.pdf';
  try{
    await sbStorageUpload('warehouse-reports',path,blob,'application/pdf');
    var res=await sbWrite('POST','warehouse_reports',{restaurant_id:AMAG.rest,week_start:weekStart,pdf_path:path});
    return (res&&res[0])||{restaurant_id:AMAG.rest,week_start:weekStart,pdf_path:path};
  }catch(e){return null;}
}
async function ensureWeeklyReport(restaurant){
  var weekStart=isoDate(mondayOf(new Date()));
  var existing=[];try{existing=await sbAuthFetch('warehouse_reports','?restaurant_id=eq.'+AMAG.rest+'&week_start=eq.'+weekStart+'&limit=1');}catch(e){return null;}
  if(existing&&existing.length)return existing[0];
  if(!AMAG.products.length)return null;
  return generateAndSaveReport(restaurant,weekStart);
}

  p.innerHTML='<div class="panel-head"><h2>Foto</h2></div>'+
    '<p class="muted" style="margin-bottom:14px">Carica le tue foto qui, poi assegnale ai piatti con un clic dal menu sotto ogni foto.</p>'+
    '<label class="mbtn gold" style="max-width:320px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer">+ Carica foto<input type="file" id="mu_files" accept="image/*" multiple hidden></label>'+
    '<div class="uploading" id="mu_s"></div>'+
    '<div id="mu_gal" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-top:20px"><p class="muted">Caricamento…</p></div>';
  document.getElementById('mu_files').onchange=mediaUpload;
  if(!ADMIN.catalog||!ADMIN.catalog.length){try{ADMIN.catalog=await sbAuthFetch('dishes','?select=id,name,base_image_url&order=name');}catch(e){ADMIN.catalog=ADMIN.catalog||[];}}
  await renderMediaGallery();
}
function dishOptionsHtml(selectedId){
  return '<option value="">Assegna a un piatto…</option>'+(ADMIN.catalog||[]).map(function(d){return '<option value="'+esc(d.id)+'"'+(String(d.id)===String(selectedId)?' selected':'')+'>'+esc(d.name)+'</option>';}).join('');
}
async function renderMediaGallery(){
  var gal=document.getElementById('mu_gal');if(!gal)return;
  var items=await mlList();
  if(!items.length){gal.innerHTML='<p class="muted">Nessuna foto caricata. Usa "+ Carica foto" qui sopra.</p>';return;}
  var canAssign=isSuper();
  var byUrl={};(ADMIN.catalog||[]).forEach(function(d){if(d.base_image_url)byUrl[d.base_image_url]=d.id;});
  gal.innerHTML=items.map(function(m){
    var assignedId=byUrl[m.url]||'';
    var assignCtl=canAssign?('<select class="mu-assign" style="width:100%;margin-top:6px;padding:7px;border-radius:8px;background:var(--adm-surface2);border:1px solid var(--adm-line2);color:var(--adm-text);font-size:12px">'+dishOptionsHtml(assignedId)+'</select>'):'';
    return '<div class="mu-card" data-mid="'+esc(m.id)+'" data-url="'+esc(m.url)+'" style="text-align:center">'+
      '<img src="'+cdnThumb(m.url,220)+'" loading="lazy" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#2a2622">'+
      assignCtl+
      '<div class="mu-note" style="font-size:11px;color:var(--gold);margin-top:3px">'+(assignedId?'✓ Assegnata':'')+'</div>'+
      (canAssign?'<button type="button" class="mbtn ghost" style="padding:6px;font-size:11px;margin:6px 0 0" data-mdel="'+esc(m.id)+'">Elimina foto</button>':'')+
      '</div>';
  }).join('');
  gal.querySelectorAll('.mu-assign').forEach(function(sel){
    sel.onchange=async function(){
      var card=sel.closest('.mu-card');var url=card.getAttribute('data-url');var id=sel.value;
      if(!id)return;
      await setDishImage(id,url);
      card.querySelector('.mu-note').textContent='✓ Assegnata';
    };
  });
  gal.querySelectorAll('[data-mdel]').forEach(function(b){
    b.onclick=async function(){
      if(!confirm('Eliminare questa foto? I piatti a cui è già assegnata la mantengono comunque.'))return;
      await mlDelete(b.getAttribute('data-mdel'));
      renderMediaGallery();
    };
  });
}
async function mediaUpload(){
  var inp=document.getElementById('mu_files'),s=document.getElementById('mu_s');
  if(!inp.files||!inp.files.length)return;
  var files=Array.prototype.slice.call(inp.files),done=0,ts=Date.now();s.textContent='Caricamento 0/'+files.length;
  for(var i=0;i<files.length;i++){try{var url=await cloudUpload(files[i],'fkpizza/media/'+ts+'_'+i);await mlSave(url,files[i].name,null);}catch(e){}done++;s.textContent='Caricamento '+done+'/'+files.length;}
  s.textContent='✓ Caricate '+done+' foto';inp.value='';
  renderMediaGallery();
}
function ensureCropper(){return new Promise(function(res,rej){if(window.Cropper)return res();var css=document.createElement('link');css.rel='stylesheet';css.href='https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css';document.head.appendChild(css);var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js';sc.onload=function(){res();};sc.onerror=function(){rej();};document.head.appendChild(sc);});}
async function openImageEditor(file,aspect,onDone,restaurantId){
  try{await ensureCropper();}catch(e){alert('Editor non disponibile (verifica la connessione).');return;}
  var url=URL.createObjectURL(file);
  var host=document.createElement('div');host.className='imged';
  host.innerHTML='<div class="imged-stage"><img id="imged-img" src="'+url+'"></div>'+
    '<div class="imged-tools">'+
    '<div class="imged-row"><span class="lbl">Zoom</span><button type="button" class="imged-tool" id="imged-zo">−</button><input type="range" id="imged-zoom" min="0" max="2" step="0.01" value="0"><button type="button" class="imged-tool" id="imged-zi">+</button></div>'+
    '<div class="imged-row"><span class="lbl">Ruota</span><button type="button" class="imged-tool" id="imged-rl">⟲</button><button type="button" class="imged-tool" id="imged-rr">⟳</button><button type="button" class="imged-tool" id="imged-rs" style="width:auto;padding:0 14px">Reset</button></div>'+
    '<div class="imged-btns"><button type="button" class="mbtn ghost" id="imged-cancel" style="margin:0">Annulla</button><button type="button" class="mbtn red" id="imged-ok" style="margin:0">Conferma</button></div>'+
    '</div>';
  document.body.appendChild(host);
  var img=host.querySelector('#imged-img');
  var cropper=new Cropper(img,{aspectRatio:aspect,viewMode:1,dragMode:'move',autoCropArea:1,background:true,responsive:true,checkOrientation:true});
  host.querySelector('#imged-zoom').oninput=function(e){cropper.zoomTo(parseFloat(e.target.value));};
  host.querySelector('#imged-zi').onclick=function(){cropper.zoom(0.1);};
  host.querySelector('#imged-zo').onclick=function(){cropper.zoom(-0.1);};
  host.querySelector('#imged-rl').onclick=function(){cropper.rotate(-90);};
  host.querySelector('#imged-rr').onclick=function(){cropper.rotate(90);};
  host.querySelector('#imged-rs').onclick=function(){cropper.reset();host.querySelector('#imged-zoom').value=0;};
  function close(){try{cropper.destroy();}catch(e){}try{URL.revokeObjectURL(url);}catch(e){}host.remove();}
  host.querySelector('#imged-cancel').onclick=close;
  host.querySelector('#imged-ok').onclick=function(){
    var ob=this;ob.textContent='...';ob.disabled=true;
    var outW=aspect>=1?1200:1080;var outH=Math.round(outW/aspect);
    var canvas=cropper.getCroppedCanvas({width:outW,height:outH,imageSmoothingQuality:'high'});
    if(!canvas){ob.textContent='Conferma';ob.disabled=false;return;}
    canvas.toBlob(function(blob){
      var f;try{f=new File([blob],'fk-edit.jpg',{type:'image/jpeg'});}catch(e){f=blob;}
      cloudUpload(f,'fkpizza/edits/'+Date.now()).then(async function(u){await mlSave(u,'foto adattata',restaurantId);close();onDone(u);}).catch(function(){ob.textContent='Conferma';ob.disabled=false;alert('Caricamento non riuscito.');});
    },'image/jpeg',0.9);
  };
}
function val(id){var e=document.getElementById(id);return e?e.value:'';}
async function up(id,folder,restaurantId){var e=document.getElementById(id);if(!e||!e.files||!e.files[0])return null;var s=document.getElementById(id+'_s');if(s)s.textContent='Caricamento…';try{var u=await cloudUpload(e.files[0],folder);await mlSave(u,e.files[0].name,restaurantId);if(s)s.textContent='✓';return u;}catch(err){if(s)s.textContent='✗ errore';return null;}}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-fklang]');if(!b)return;
  var l=b.getAttribute('data-fklang');
  LANG=l;localStorage.setItem('fkLang',l);document.documentElement.lang=l;
  if(document.querySelector('.fkmenu')){openWebMenu(LAST_MENU_R,LAST_MENU_DISHES,FAST.mode);return;}
  rerender();
});
function rerender(){
  clearInterval(ADMIN.ordersTimer);
  var page=getPageType();
  document.getElementById('home-root').hidden=true;
  document.getElementById('rest-root').hidden=true;
  document.getElementById('admin-root').hidden=true;
  closeModal();CAROUSELS=[];
  if(page==='homepage')initHomepage();
  else if(page==='admin')initAdmin();
  else initRestaurant(page);
}
(function(){
  document.documentElement.lang=LANG;
  var page=getPageType();
  if(page==='homepage')initHomepage();
  else if(page==='admin')initAdmin();
  else initRestaurant(page);
})();
</script>
