<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>FK Pizza & More</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#c0392b;--gold:#b5986a;--crown:#d4b483;--black:#0a0a0a;--cream:#f2ede6;--dark:#111;--white:#fff;--font-serif:'Playfair Display',Georgia,serif;--font-sans:'Inter',sans-serif}
html{scroll-behavior:smooth;overflow-x:hidden}
body{font-family:var(--font-sans);background:var(--black);color:var(--white);overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
[hidden]{display:none!important}
#loader{position:fixed;inset:0;background:var(--black);z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .6s,visibility .6s}
#loader.out{opacity:0;visibility:hidden;pointer-events:none}
.ld-logo{width:90px;height:90px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;animation:ldpulse 1s ease-in-out infinite alternate}
.ld-logo img{width:70px;height:70px;object-fit:contain}
@keyframes ldpulse{from{transform:scale(.95);opacity:.8}to{transform:scale(1.05);opacity:1}}
nav,#r-nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(10,10,10,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .3s}
nav.solid,#r-nav.solid{background:rgba(10,10,10,.95)}
.nav-logo-wrap{width:58px;height:58px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.nav-logo-wrap img{width:48px;height:48px;object-fit:contain}
.nav-tagline{font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--crown)}
.nav-burger{width:48px;height:48px;background:rgba(26,26,26,.85);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex-shrink:0}
.nav-burger span{display:block;width:22px;height:2px;background:#fff;border-radius:2px}
/* DRAWER */
#drawer{position:fixed;inset:0;z-index:800;visibility:hidden;opacity:0;transition:opacity .3s,visibility .3s}
#drawer.open{visibility:visible;opacity:1}
#drawer .ov{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#drawer .panel{position:absolute;top:0;right:0;bottom:0;width:84%;max-width:340px;background:#141210;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);padding:24px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
#drawer.open .panel{transform:none}
.dw-h{font-family:var(--font-serif);color:var(--gold);font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin:18px 0 6px}
.dw-link{display:block;padding:13px 4px;font-size:16px;border-bottom:1px solid rgba(255,255,255,.07);color:#eee}
.dw-link:active{color:var(--gold)}
.dw-rest{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-size:15px}
.dw-rest small{color:rgba(255,255,255,.4);font-size:11px}
.dw-close{position:absolute;top:14px;right:16px;width:40px;height:40px;font-size:26px;color:#fff}
.langrow{display:flex;gap:8px;margin-top:6px}
.langrow button{flex:1;padding:9px;border:1px solid rgba(181,152,106,.4);border-radius:8px;font-size:12px;font-weight:600;letter-spacing:.06em}
.langrow button.on{background:var(--gold);color:var(--black);border-color:var(--gold)}
/* HERO */
.hero{position:relative;height:100svh;min-height:600px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:var(--black)}
.hero-bg{position:absolute;inset:-4%;background-color:var(--black);background-repeat:no-repeat;background-position:center;background-size:cover;will-change:transform}
.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,5,5,.2) 0%,rgba(5,5,5,0) 38%,rgba(5,5,5,.35) 70%,rgba(5,5,5,.88) 90%,rgba(5,5,5,.98) 100%)}
.hero-body{position:relative;z-index:2;padding:0 20px 56px}
.hero-center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;text-align:center;padding-top:96px}
.hero-center .logo-badge{width:148px;height:148px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.hero-center .logo-badge img{width:78%;height:78%;object-fit:contain}
.hero-h1{font-family:var(--font-serif);font-size:clamp(44px,13vw,92px);font-weight:900;line-height:.97;letter-spacing:-.01em;text-transform:uppercase;margin-bottom:16px;text-shadow:0 2px 30px rgba(0,0,0,.7)}
.hero-h1 em{color:var(--red);font-style:normal}
.hero-sub{font-size:13px;color:rgba(255,255,255,.9);letter-spacing:.04em;margin-bottom:26px;text-shadow:0 1px 16px rgba(0,0,0,.8)}
.hero-btn{display:inline-flex;align-items:center;gap:8px;padding:15px 24px;background:var(--red);color:#fff;border-radius:14px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 4px 16px rgba(192,57,43,.3)}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hero-actions a{flex:1;min-width:90px;display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 12px;background:var(--red);color:#fff;border-radius:14px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 4px 16px rgba(192,57,43,.3)}
.hero-actions a svg{width:18px;height:18px;flex-shrink:0}
.hero-actions a.wa{background:#1f8f4e}.hero-actions a.call{background:#1a1a1a}
.hero-scroll{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:2;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45)}
#r-hero-bg{inset:0}
#r-bottombar{position:fixed;bottom:0;left:0;right:0;z-index:700;display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(10,10,10,.9);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.08)}
#r-bottombar a{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:14px 8px;border-radius:12px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#fff}
#r-bottombar a svg{width:17px;height:17px}
#r-bottombar a.call{background:#1f1f1f}#r-bottombar a.book{background:var(--red)}#r-bottombar a.wa{background:#1f8f4e}
.has-bottombar{padding-bottom:84px}
.logo-sec{background:var(--black);display:flex;flex-direction:column;align-items:center;padding:60px 20px}
.logo-big{width:180px;height:180px;background:#fff;border-radius:24px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;overflow:hidden}
.logo-big img{width:80%;height:80%;object-fit:contain}
.logo-sub{font-size:11px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--crown);display:flex;align-items:center;gap:10px}
.logo-sub em{font-style:normal;font-size:7px;opacity:.5}
.sec{padding:60px 0}
.sec-cream{background:var(--cream);color:var(--black)}
.sec-dark{background:var(--black);color:var(--white)}
.sec-hd{text-align:center;padding:0 20px;margin-bottom:32px}
.sec-tag{font-size:10px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:10px}
.sec-title{font-family:var(--font-serif);font-size:clamp(30px,8vw,58px);font-weight:700;line-height:1.05}
.sec-title em{color:var(--red);font-style:normal}
.sec-rule{width:46px;height:2px;background:var(--red);margin:14px auto 0}
.cat-title{font-family:var(--font-serif);font-size:clamp(24px,6vw,38px);font-weight:700;text-align:center;margin:6px 0 4px}
.cat-rule{width:40px;height:2px;background:var(--gold);margin:0 auto 22px}
.sec-cream .cat-title{color:var(--black)}
.rv{opacity:0;transform:translateY(30px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
.car-scroll{overflow:hidden}
.car-track{display:flex;position:relative;transition:transform .45s cubic-bezier(.4,0,.2,1);will-change:transform}
.car-nav{display:flex;gap:12px;justify-content:center;margin-top:22px}
.car-btn{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0;touch-action:manipulation}
.car-btn:active{transform:scale(.9)}
.car-btn svg{width:14px;height:14px}
.car-btn-dark{border:1.5px solid rgba(0,0,0,.2);background:#fff;color:#222}
.car-btn-dark:active{background:var(--red);border-color:var(--red);color:#fff}
.car-btn-light{border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#fff}
.car-btn-light:active{background:var(--red);border-color:var(--red);color:#fff}
.rest-slide{flex:0 0 100%;padding:0 20px}
.rest-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.rest-img{aspect-ratio:16/9;background:#111;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.rest-img img.logo-in{width:96px;height:96px;object-fit:contain;border-radius:12px}
.rest-img img.hero-in{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.rest-info{padding:22px}
.rest-name{font-family:var(--font-serif);font-size:26px;font-weight:700;color:var(--black);margin-bottom:6px}
.rest-addr{font-size:12px;color:rgba(0,0,0,.45);margin-bottom:18px}
.rest-cta{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--red);border-bottom:1px solid var(--red);padding-bottom:2px;display:inline-flex;gap:6px}
/* DISH */
.dish-slide{flex:0 0 80%;padding:0 8px}
.dish-slide:first-child{padding-left:20px}.dish-slide:last-child{padding-right:20px}
.dish-card{border-radius:16px;overflow:hidden;position:relative;aspect-ratio:.82;background:#1a1a1a}
.dish-ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dish-ph-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#2a2622,#141210)}
.dish-ph-empty svg{width:54px;height:54px;opacity:.4;color:var(--gold)}
.dish-card-body{position:absolute;bottom:0;left:0;right:0;padding:18px 18px 16px;background:linear-gradient(to top,rgba(0,0,0,.92) 12%,rgba(0,0,0,.45) 60%,transparent 100%)}
.dish-card-name{font-family:var(--font-serif);font-size:21px;font-weight:700;color:#fff;margin-bottom:4px;line-height:1.1}
.dish-card-desc{font-size:12px;color:rgba(255,255,255,.72);line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dish-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dish-card-price{font-size:16px;font-weight:600;color:var(--gold)}
.alg-row{display:flex;gap:4px;flex-wrap:wrap}
.alg-chip{font-size:13px;line-height:1;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12)}
.rev-slide{flex:0 0 88%;padding:0 8px}
.rev-slide:first-child{padding-left:20px}.rev-slide:last-child{padding-right:20px}
.rev-card{background:#1a1a1a;border-radius:16px;padding:24px;border:1px solid rgba(255,255,255,.06)}
.rev-verified{font-size:11px;color:rgba(255,255,255,.35);margin-bottom:10px}
.rev-verified em{color:#4ade80;font-style:normal;font-weight:600}
.rev-stars{color:#f59e0b;font-size:18px;letter-spacing:2px;margin-bottom:14px}
.rev-text{font-size:14px;line-height:1.7;color:rgba(255,255,255,.82);margin-bottom:16px}
.rev-author{font-size:12px;color:rgba(255,255,255,.35)}
.insta-slide{flex:0 0 46%;padding:0 5px}
.insta-slide:first-child{padding-left:20px}.insta-slide:last-child{padding-right:20px}
.insta-card{border-radius:12px;overflow:hidden;aspect-ratio:1;position:relative;background:#1a1a1a;display:block}
.insta-card img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.insta-handle-label{position:absolute;bottom:10px;left:12px;font-size:12px;font-weight:500;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.r-where{background:var(--cream);color:var(--black);padding:60px 0}
.r-map{max-width:760px;margin:0 auto 26px;padding:0 20px}
.r-map-frame{border-radius:16px;overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.12);aspect-ratio:16/10;border:0;width:100%}
.r-meta{max-width:620px;margin:0 auto;padding:0 24px;display:grid;gap:22px}
.r-meta h4{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.r-meta p,.r-meta li{font-size:14px;line-height:1.7;color:#333}
.r-hours{list-style:none;display:grid;gap:6px}
.r-hours li{display:flex;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,.07);padding-bottom:6px}
.r-hours li.closed span:last-child{color:var(--red);font-weight:600}
.r-hours li.today{font-weight:700}
.tool-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px;padding:0 20px}
.tool-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:12px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--black);color:#fff}
.tool-btn.gold{background:var(--gold);color:var(--black)}
footer{background:var(--black);border-top:1px solid rgba(255,255,255,.06);padding:30px 20px;text-align:center}
.ft-copy{font-size:11px;color:rgba(255,255,255,.3);line-height:2}
.ft-copy a{color:rgba(255,255,255,.45);border-bottom:1px solid rgba(255,255,255,.15)}
.sk{background:linear-gradient(90deg,#1c1c1c 25%,#252525 50%,#1c1c1c 75%);background-size:200% 100%;animation:sk 1.4s ease infinite}
.sk-cream{background:linear-gradient(90deg,#e8e2da 25%,#ddd6cd 50%,#e8e2da 75%);background-size:200% 100%;animation:sk 1.4s ease infinite}
@keyframes sk{to{background-position:-200% 0}}
/* MODAL */
.modal{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .ov{position:absolute;inset:0;background:rgba(0,0,0,.8)}
.modal-box{position:relative;width:100%;max-width:420px;max-height:86vh;overflow-y:auto;background:#161310;border:1px solid rgba(181,152,106,.3);border-radius:18px;padding:26px}

.modal-x{position:absolute;top:12px;right:14px;width:36px;height:36px;font-size:22px;color:#fff}

.alg-legend .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);font-size:16px;flex-shrink:0}
.qr-img{width:240px;height:240px;margin:0 auto;background:#fff;border-radius:12px;padding:10px}
.qr-link{font-size:12px;text-align:center;color:var(--crown);word-break:break-all;margin-top:14px}
.mbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-top:10px}
.mbtn.red{background:var(--red);color:#fff}.mbtn.green{background:#1f8f4e;color:#fff}.mbtn.gold{background:var(--gold);color:var(--black)}.mbtn.ghost{border:1px solid rgba(181,152,106,.4);color:var(--crown)}
/* ADMIN */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 0%,#1c1916,var(--black))}
.login-box{width:100%;max-width:380px;background:rgba(255,255,255,.04);border:1px solid rgba(181,152,106,.3);border-radius:18px;padding:38px 30px}
.login-box h1{font-family:var(--font-serif);text-align:center;color:var(--gold);font-size:28px;margin-bottom:4px}
.login-box .sub{text-align:center;opacity:.55;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;background:rgba(0,0,0,.4);border:1px solid rgba(181,152,106,.3);border-radius:9px;color:#fff;font-family:inherit;font-size:15px}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold)}
.err{background:rgba(192,57,43,.18);border:1px solid var(--red);color:#ffb3a8;padding:10px;border-radius:8px;font-size:13px;margin-bottom:14px;text-align:center}
.admin-top{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:rgba(20,18,16,.96);border-bottom:1px solid rgba(181,152,106,.2);position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:10px}
.admin-top .who{font-family:var(--font-serif);color:var(--gold);font-size:19px}
.admin-top .who small{display:block;font-family:var(--font-sans);font-size:11px;opacity:.6;letter-spacing:.08em;text-transform:uppercase}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:16px 22px;border-bottom:1px solid rgba(181,152,106,.12)}
.tabs button{padding:9px 16px;border-radius:30px;font-size:13px;font-weight:600;background:rgba(255,255,255,.05)}
.tabs button.active{background:var(--gold);color:var(--black)}
.panel{padding:22px;max-width:1000px;margin:0 auto}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.panel-head h2{font-family:var(--font-serif);font-size:24px}
.adrow{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.04);border:1px solid rgba(181,152,106,.18);border-radius:12px;padding:14px;margin-bottom:12px}
.adrow img{width:60px;height:60px;border-radius:9px;object-fit:cover;background:#2a2622;flex-shrink:0}
.adrow .info{flex:1;min-width:0}
.adrow .info h4{font-family:var(--font-serif);font-size:17px}
.adrow .info p{font-size:12px;opacity:.65}
.switch{position:relative;width:46px;height:25px;flex-shrink:0}
.switch input{display:none}
.switch i{position:absolute;inset:0;background:#444;border-radius:30px;transition:.25s}
.switch i::after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.25s}
.switch input:checked + i{background:var(--red)}
.switch input:checked + i::after{transform:translateX(21px)}
.muted{opacity:.6;font-size:13px}
.uploading{font-size:12px;color:var(--gold);margin-top:6px}
.thumb-up{width:84px;height:84px;border-radius:10px;object-fit:cover;background:#2a2622;border:1px solid rgba(181,152,106,.3);margin-top:8px}
</style>

var lazyObs=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&e.target.dataset.src){e.target.src=e.target.dataset.src;lazyObs.unobserve(e.target);}});},{rootMargin:'300px'});
function lazyImg(src,cls,styleStr){var img=document.createElement('img');img.dataset.src=src;img.alt='';img.loading='lazy';if(cls)img.className=cls;if(styleStr)img.style.cssText=styleStr;img.onerror=function(){img.style.display='none';};lazyObs.observe(img);return img;}
var revealObs=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');revealObs.unobserve(e.target);}});},{threshold:.07});
function bindReveal(scope){(scope||document).querySelectorAll('.rv').forEach(function(el){revealObs.observe(el);});}

var CAROUSELS=[];
function attachCarousel(scrollId,prevId,nextId,autoMs){var sc=document.getElementById(scrollId);if(!sc)return;var index=0,timer=null;
function tk(){return sc.querySelector('.car-track');}
function count(){var t=tk();return t?t.children.length:0;}
function apply(){var t=tk();if(!t||!t.children.length)return;var n=t.children.length;if(index>=n)index=0;if(index<0)index=n-1;var x=0;for(var i=0;i<index;i++)x+=t.children[i].getBoundingClientRect().width;t.style.transform='translateX('+(-x)+'px)';}
function go(d){var n=count();if(n<1)return;index=(index+d+n)%n;apply();}
function start(){stop();if(!autoMs||count()<2)return;timer=setInterval(function(){if(!document.hidden)go(1);},autoMs);}
function stop(){if(timer){clearInterval(timer);timer=null;}}
function bump(){stop();start();}
var prev=document.getElementById(prevId),next=document.getElementById(nextId);
if(prev)prev.onclick=function(e){e.preventDefault();go(-1);bump();};
if(next)next.onclick=function(e){e.preventDefault();go(1);bump();};
var x0=null,y0=null;
sc.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;stop();},{passive:true});
sc.addEventListener('touchend',function(e){if(x0!==null){var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))go(dx<0?1:-1);}x0=null;y0=null;start();},{passive:true});
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(apply,150);});
CAROUSELS.push({apply:apply,start:start});}
function startAllCarousels(){CAROUSELS.forEach(function(c){c.apply();c.start();});}
document.addEventListener('visibilitychange',function(){if(!document.hidden)startAllCarousels();});

  fillTrack('rev-scroll',revs,function(rv){var s=document.createElement('div');s.className='rev-slide';var ds=rv.created_at?new Date(rv.created_at).toLocaleDateString(LANG,{month:'long',year:'numeric'}):'';s.innerHTML='<div class="rev-card"><p class="rev-verified">✔ <em>Tripadvisor</em></p><div class="rev-stars">'+stars(rv.rating)+'</div><p class="rev-text">'+esc(rv.text)+'</p><p class="rev-author">'+esc(rv.name||'Anonimo')+(ds?' · '+ds:'')+'</p></div>';return s;});
  fillTrack('insta-scroll',INSTA,function(a){var s=document.createElement('div');s.className='insta-slide';var link=document.createElement('a');link.className='insta-card';link.href='https://instagram.com/'+a.handle.replace('@','');link.target='_blank';link.appendChild(lazyImg(a.img));var lbl=document.createElement('span');lbl.className='insta-handle-label';lbl.textContent=a.handle;link.appendChild(lbl);s.appendChild(link);return s;});
  attachCarousel('rest-scroll','rest-scroll-prev','rest-scroll-next',4500);
  attachCarousel('dish-scroll','dish-scroll-prev','dish-scroll-next',2200);
  attachCarousel('rev-scroll','rev-scroll-prev','rev-scroll-next',5500);
  attachCarousel('insta-scroll','insta-scroll-prev','insta-scroll-next',3000);
  startAllCarousels();bindReveal(root);finishLoad();
}

/* ---------- RESTAURANT ---------- */
function buildRestaurantPage(R,dishes,reviews,instas){
  var root=document.getElementById('rest-root');root.hidden=false;root.classList.add('has-bottombar');
  var phone=digits(R.phone),wa=digits(R.whatsapp||R.phone);
  var waMsg=encodeURIComponent('Ciao '+(R.name||'')+', vorrei prenotare un tavolo.');
  var heroImg=heroFill(R.hero_image_url)||HOME_HERO;
  var hasInsta=instas&&instas.length;
  var sub=R.subdomain||R.slug||'';
  var coords=parseJson(R.coordinates,null);
  var mapQ=(coords&&coords.lat)?(coords.lat+','+coords.lng):encodeURIComponent(R.address||R.name||'FK Pizza');
  var oh=parseJson(R.open_hours,{}),closed=R.closed_days||[],today=jsToday();

  // group dishes by category
  var groups={};dishes.forEach(function(d){var c=d.cat||d.c||'MENU';(groups[c]=groups[c]||[]).push(d);});
  var catBlocks='';var catIds=[];
  CAT_ORDER.forEach(function(c){if(!groups[c]||!groups[c].length)return;var id='cat-'+catIds.length;catIds.push({id:id,c:c});catBlocks+='<div class="rv" style="margin-top:34px"><h3 class="cat-title">'+esc(catLabel(c))+'</h3><div class="cat-rule"></div>'+carBlock(id,'car-btn-dark')+'</div>';});

  var html='<nav id="r-nav"><div style="display:flex;align-items:center;gap:12px;min-width:0"><a href="'+location.pathname+'" class="nav-logo-wrap"><img src="'+cdnUrl(FK_LOGO,100,100)+'" alt="FK"/></a><span class="nav-tagline">Pizza · Ristorante · Steak House</span></div><button class="nav-burger" id="rburger"><span></span><span></span><span></span></button></nav>';
  html+='<section class="hero" id="r-hero"><div class="hero-bg" id="r-hero-bg"></div><div class="hero-body"><div class="hero-center"><div class="logo-badge"><img src="'+cdnUrl(R.logo_url||FK_LOGO,320,320)+'" alt="'+esc(R.name)+'"/></div><h1 class="hero-h1">'+esc(R.name)+'</h1><p class="hero-sub" style="color:var(--crown);text-transform:uppercase;letter-spacing:.22em;font-size:11px;font-weight:600">Pizza · Ristorante · Steak House</p></div></div><p class="hero-scroll">'+t('scrolltxt')+'</p></section>';
  html+='<section id="r-dishes" class="sec sec-cream"><div class="sec-hd rv"><span class="sec-tag">'+t('menu')+'</span><h2 class="sec-title">Menu</h2><div class="sec-rule"></div></div>'+catBlocks+'<div class="tool-row"><button class="tool-btn gold" id="r-allerg">'+t('allergens')+'</button><button class="tool-btn" id="r-wa-export">'+t('exportwa')+'</button><button class="tool-btn" id="r-qr">'+t('qr')+'</button></div></section>';
  html+='<section id="r-reviews" class="sec sec-dark"><div class="sec-hd rv"><span class="sec-tag">Dicono di Noi</span><h2 class="sec-title">'+t('reviews')+'</h2><div class="sec-rule"></div></div><div class="rv">'+carBlock('rr-scroll','car-btn-light')+'</div></section>';
  if(hasInsta)html+='<section class="sec sec-dark"><div class="sec-hd rv"><span class="sec-tag">Instagram</span><h2 class="sec-title">@'+esc(instas[0].instagram_handle||instas[0].handle||'fkpizza')+'</h2><div class="sec-rule"></div></div></section>';
  html+='<section id="r-dove" class="r-where"><div class="sec-hd rv"><span class="sec-tag" style="color:var(--gold)">'+t('where')+'</span><h2 class="sec-title" style="color:var(--black)">'+t('where')+'</h2><div class="sec-rule"></div></div>';
  html+='<div class="r-map rv"><iframe class="r-map-frame" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q='+mapQ+'&z=15&output=embed"></iframe></div><div class="r-meta rv">';
  if(R.address)html+='<div><h4>'+t('address')+'</h4><p>'+esc(R.address)+'</p></div>';
  if(phone)html+='<div><h4>'+t('phone')+'</h4><p><a href="tel:'+phone+'" style="color:var(--red)">'+esc(R.phone)+'</a></p></div>';
  var hoursRows='';DAYS.forEach(function(d,i){var isC=closed.indexOf(d)!==-1||!oh[d];var label=isC?t('closed'):oh[d];hoursRows+='<li class="'+(isC?'closed ':'')+(d===today?'today':'')+'"><span>'+dayLabel(i)+'</span><span>'+esc(label)+'</span></li>';});
  html+='<div><h4>'+t('hours')+'</h4><ul class="r-hours">'+hoursRows+'</ul></div></div></section>';
  html+='<div id="r-bottombar"><a href="'+(phone?'tel:'+phone:'#r-dove')+'" class="call"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>'+t('call')+'</a><a href="#r-dove" class="book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'+t('book')+'</a><a href="'+(wa?'https://wa.me/'+wa.replace('+','')+'?text='+waMsg:'#r-dove')+'"'+(wa?' target="_blank"':'')+' class="wa"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 0 1-1.587-5.945C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 0 1 8.413 3.488 11.824 11.824 0 0 1 3.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 0 1-5.688-1.448L.057 24z"/></svg>WhatsApp</a></div>';
  html+='<footer><p class="ft-copy">© 2026 '+esc(R.name||'FK')+' — FK Pizza & More · <a href="'+location.pathname+'">'+t('back')+'</a></p></footer>';
  root.innerHTML=html;
  document.getElementById('r-hero-bg').style.backgroundImage="url('"+heroImg+"')";
  document.getElementById('rburger').onclick=function(){buildDrawer({type:'rest'});openDrawer();};
  document.getElementById('r-allerg').onclick=legendModal;
  document.getElementById('r-qr').onclick=function(){qrModal(sub,R.name);};
  document.getElementById('r-wa-export').onclick=function(){waExportModal(R,dishes);};
  // fill category carousels (faster autoplay)
  catIds.forEach(function(o){fillTrack(o.id,groups[o.c],dishCard);attachCarousel(o.id,o.id+'-prev',o.id+'-next',2200);});
  fillTrack('rr-scroll',reviews,function(rv){var s=document.createElement('div');s.className='rev-slide';var ds=rv.created_at?new Date(rv.created_at).toLocaleDateString(LANG,{month:'long',year:'numeric'}):'';s.innerHTML='<div class="rev-card"><p class="rev-verified">✔ <em>Tripadvisor</em></p><div class="rev-stars">'+stars(rv.rating)+'</div><p class="rev-text">'+esc(rv.text)+'</p><p class="rev-author">'+esc(rv.name||'Anonimo')+(ds?' · '+ds:'')+'</p></div>';return s;});
  attachCarousel('rr-scroll','rr-scroll-prev','rr-scroll-next',5500);
  startAllCarousels();bindReveal(root);document.title=(R.name||'FK Pizza')+' — FK Pizza & More';
}

async function initRestaurant(sub){
  var R=null;
  try{var res=await sbFetch('restaurants','?subdomain=eq.'+encodeURIComponent(sub)+'&limit=1');if(res&&res.length)R=res[0];if(!R){res=await sbFetch('restaurants','?slug=eq.'+encodeURIComponent(sub)+'&limit=1');if(res&&res.length)R=res[0];}}catch(e){}
  if(!R)R=FALLBACK_RESTAURANTS.filter(function(x){return x.subdomain===sub;})[0]||{name:sub.replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();}),subdomain:sub,address:'',logo_url:FK_LOGO,hero_image_url:FALLBACK_RESTAURANT_HERO,open_hours:FALLBACK_RESTAURANTS[0].open_hours,closed_days:[]};
  // load restaurant list for drawer
  try{var all=await sbFetch('restaurants','?order=name');ALL_RESTAURANTS=(all&&all.length)?all:FALLBACK_RESTAURANTS;}catch(e){ALL_RESTAURANTS=FALLBACK_RESTAURANTS;}
  // dishes
  var dishes=[];
  try{var rd=await sbFetch('restaurant_dishes','?restaurant_id=eq.'+R.id+'&active=eq.true&select=custom_image_url,dishes(name,description,price,base_image_url,category)');if(rd&&rd.length)dishes=rd.filter(function(x){return x.dishes;}).map(function(x){var d=x.dishes;return{name:d.name,desc:d.description,price:d.price,cat:(d.category||'MENU'),image_url:x.custom_image_url||d.base_image_url};});}catch(e){}
  if(!dishes.length)dishes=MENU.map(function(m){return{name:m.n,desc:m.d,price:m.p,cat:m.c,allergens:m.a};});
  var reviews=[];try{reviews=await sbFetch('reviews','?restaurant_id=eq.'+R.id+'&order=created_at.desc');}catch(e){}
  if(!reviews||!reviews.length)reviews=FALLBACK_REVIEWS;
  var instas=[];try{instas=await sbFetch('instagram_feeds','?restaurant_id=eq.'+R.id);}catch(e){}
  buildRestaurantPage(R,dishes,reviews,instas);finishLoad();
}

/* ---------- ADMIN ---------- */
var ADMIN={user:null,restaurants:[],tab:'restaurants'};
function adminAuth(){try{return JSON.parse(localStorage.getItem('adminAuth'));}catch(e){return null;}}
async function initAdmin(){
  var u=adminAuth();
  if(!u){renderLogin();finishLoad();return;}
  ADMIN.user=u;
  try{ADMIN.restaurants=await sbFetch('restaurants','?order=name');if(!ADMIN.restaurants.length)ADMIN.restaurants=FALLBACK_RESTAURANTS;}catch(e){ADMIN.restaurants=FALLBACK_RESTAURANTS;}
  renderAdminPanel();finishLoad();
}
function renderLogin(err){
  var root=document.getElementById('admin-root');root.hidden=false;
  root.innerHTML='<div class="login-screen"><div class="login-box"><h1>FK Pizza</h1><div class="sub">'+t('reserved')+'</div>'+(err?'<div class="err">'+esc(err)+'</div>':'')+'<div class="field"><label>Email</label><input id="lemail" type="email"></div><div class="field"><label>Password</label><input id="lpass" type="password"></div><button class="mbtn red" id="lbtn" style="margin-top:4px">'+t('login')+'</button><p class="muted" style="text-align:center;margin-top:14px"><a href="'+location.pathname+'" style="color:var(--crown)">← '+t('home')+'</a></p></div></div>';
  document.getElementById('lbtn').onclick=doLogin;
  document.getElementById('lpass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
}
async function doLogin(){
  var email=document.getElementById('lemail').value.trim(),pass=document.getElementById('lpass').value;
  if(!email||!pass){renderLogin('Inserisci email e password.');return;}
  var a=null;
  try{
    var auth=await sbAuthSignIn(email,pass);
    localStorage.setItem('fkJwt',auth.access_token);
    if(auth.refresh_token)localStorage.setItem('fkJwtR',auth.refresh_token);
    // legge il proprio record admin (policy: auth.uid() = auth_user_id)
    var rows=await sbAuthFetch('admins','?auth_user_id=eq.'+auth.user.id);
    if(rows&&rows.length)a=rows[0];
    else a={id:auth.user.id,email:auth.user.email,name:auth.user.email,role:'admin',restaurants_assigned:[]};
  }catch(e){
    // fallback locale (offline / DB non raggiungibile)
    if(email===FALLBACK_ADMIN.email&&pass===FALLBACK_ADMIN.password)a=FALLBACK_ADMIN;
  }
  if(!a){renderLogin('Credenziali non valide.');return;}
  localStorage.setItem('adminAuth',JSON.stringify({id:a.id||'',email:a.email,name:a.name||a.email,role:a.role,restaurants_assigned:a.restaurants_assigned||[]}));
  initAdmin();
}
function adminLogout(){sbAuthSignOut().finally(function(){localStorage.removeItem('adminAuth');localStorage.removeItem('fkJwt');localStorage.removeItem('fkJwtR');location.reload();});}
function renderAdminPanel(){
  var root=document.getElementById('admin-root');root.hidden=false;
  root.innerHTML='<div class="admin-top"><div class="who">FK Admin <small>'+esc(ADMIN.user.name||ADMIN.user.email)+' · '+esc(ADMIN.user.role||'')+'</small></div><button class="mbtn ghost" style="width:auto;padding:8px 16px;margin:0" id="lo">'+t('logout')+'</button></div>'+
  '<div class="tabs"><button data-t="restaurants" class="active">Ristoranti</button><button data-t="dishes">Catalogo Piatti</button></div><div class="panel" id="apanel"></div>';
  document.getElementById('lo').onclick=adminLogout;
  root.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){ADMIN.tab=b.dataset.t;root.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('active');});b.classList.add('active');renderAdminTab();};});
  renderAdminTab();
}
function renderAdminTab(){var p=document.getElementById('apanel');if(ADMIN.tab==='restaurants')adminRestaurants(p);else adminDishes(p);}
function adminRestaurants(p){
  var rows=ADMIN.restaurants.map(function(r,i){return '<div class="adrow"><img data-img src="'+cdnUrl(r.hero_image_url||r.logo_url||FK_LOGO,120,120)+'"><div class="info"><h4>'+esc(r.name)+'</h4><p>'+esc(r.subdomain||'')+' · '+esc(r.address||'')+'</p></div><button class="mbtn gold" style="width:auto;padding:8px 14px;margin:0" data-qr="'+i+'">QR</button><button class="mbtn ghost" style="width:auto;padding:8px 14px;margin:0" data-ed="'+i+'">Modifica</button></div>';}).join('');
  p.innerHTML='<div class="panel-head"><h2>Ristoranti</h2></div>'+rows;
  p.querySelectorAll('img[data-img]').forEach(function(im){im.onerror=function(){im.style.visibility='hidden';};});
  p.querySelectorAll('[data-qr]').forEach(function(b){b.onclick=function(){var r=ADMIN.restaurants[b.dataset.qr];qrModal(r.subdomain||r.slug,r.name);};});
  p.querySelectorAll('[data-ed]').forEach(function(b){b.onclick=function(){adminEditRest(ADMIN.restaurants[b.dataset.ed]);};});
}
function adminEditRest(r){
  var oh=parseJson(r.open_hours,{}),closed=r.closed_days||[];
  var hours=DAYS.map(function(d,i){return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><label style="min-width:120px;font-size:13px;display:flex;gap:6px;align-items:center"><input type="checkbox" class="rcl" value="'+d+'" '+(closed.indexOf(d)!==-1?'checked':'')+'>'+dayLabel(i)+'</label><input class="rhr" data-d="'+d+'" value="'+esc(oh[d]||'')+'" placeholder="12-15 / 19-23" style="flex:1;padding:8px;background:rgba(0,0,0,.4);border:1px solid rgba(181,152,106,.3);border-radius:8px;color:#fff"></div>';}).join('');
  openModal('<h3>'+esc(r.name)+'</h3>'+
    '<div class="field"><label>Nome</label><input id="e_name" value="'+esc(r.name||'')+'"></div>'+
    '<div class="field"><label>Telefono</label><input id="e_phone" value="'+esc(r.phone||'')+'"></div>'+
    '<div class="field"><label>WhatsApp</label><input id="e_wa" value="'+esc(r.whatsapp||'')+'"></div>'+
    '<div class="field"><label>Indirizzo</label><input id="e_addr" value="'+esc(r.address||'')+'"></div>'+
    '<div class="field"><label>Logo</label><input id="e_logo" type="file" accept="image/*">'+(r.logo_url?'<img class="thumb-up" src="'+cdnUrl(r.logo_url,160,160)+'">':'')+'<div class="uploading" id="e_logo_s"></div></div>'+
    '<div class="field"><label>Hero</label><input id="e_hero" type="file" accept="image/*">'+(r.hero_image_url?'<img class="thumb-up" src="'+cdnUrl(r.hero_image_url,160,160)+'">':'')+'<div class="uploading" id="e_hero_s"></div></div>'+
    '<div class="field"><label>Orari</label>'+hours+'</div>'+
    '<button class="mbtn red" id="e_save">Salva</button>');
  document.getElementById('e_save').onclick=async function(){
    var btn=this;btn.textContent='...';
    var box=document.querySelector('.modal-box');
    var hh={};box.querySelectorAll('.rhr').forEach(function(i){hh[i.dataset.d]=i.value.trim();});
    var cl=[];box.querySelectorAll('.rcl:checked').forEach(function(c){cl.push(c.value);});
    var body={name:val('e_name'),phone:val('e_phone'),whatsapp:val('e_wa'),address:val('e_addr'),open_hours:hh,closed_days:cl};
    var logo=await up('e_logo','fkpizza/'+(r.slug||r.subdomain||'rest'));var hero=await up('e_hero','fkpizza/'+(r.slug||r.subdomain||'rest'));
    if(logo)body.logo_url=logo;if(hero)body.hero_image_url=hero;
    Object.assign(r,body);
    try{if(r.id)await sbWrite('PATCH','restaurants',body,'?id=eq.'+r.id);}catch(e){alert('Salvataggio DB non riuscito (verifica RLS). Modifica applicata localmente.');}
    closeModal();renderAdminTab();
  };
}
function adminDishes(p){
  var groups={};MENU.forEach(function(d){(groups[d.c]=groups[d.c]||[]).push(d);});
  var html='<div class="panel-head"><h2>Catalogo Piatti</h2><span class="muted">'+MENU.length+' piatti</span></div>';
  CAT_ORDER.forEach(function(c){if(!groups[c])return;html+='<h4 style="font-family:var(--font-serif);color:var(--gold);margin:18px 0 10px">'+esc(catLabel(c))+'</h4>';groups[c].forEach(function(d){html+='<div class="adrow"><div class="dish-ph-empty" style="position:static;width:60px;height:60px;border-radius:9px;flex-shrink:0">'+DISH_ICON+'</div><div class="info"><h4>'+esc(d.n)+'</h4><p>'+esc(d.d||'')+' · '+algRow(d.a).replace(/<div class="alg-row">|<\/div>/g,'')+'</p></div><span class="dish-card-price" style="color:var(--gold)">'+priceFmt(d.p)+'</span></div>';});});
  p.innerHTML=html;
}
function val(id){var e=document.getElementById(id);return e?e.value:'';}
async function up(id,folder){var e=document.getElementById(id);if(!e||!e.files||!e.files[0])return null;var s=document.getElementById(id+'_s');if(s)s.textContent='Caricamento…';try{var u=await cloudUpload(e.files[0],folder);if(s)s.textContent='✓';return u;}catch(err){if(s)s.textContent='✗ errore';return null;}}

function rerender(){var page=getPageType();document.getElementById('home-root').hidden=true;document.getElementById('rest-root').hidden=true;document.getElementById('admin-root').hidden=true;CAROUSELS=[];if(page==='homepage')initHomepage();else if(page==='admin')initAdmin();else initRestaurant(page);}
(function(){document.documentElement.lang=LANG;var page=getPageType();if(page==='homepage')initHomepage();else if(page==='admin')initAdmin();else initRestaurant(page);})();
</script>
